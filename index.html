<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TactiGrid Drill Designer</title>

  <!-- Fabric + jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <style>
    :root{
      --bg:#0b0c0f;
      --panel:#101218;
      --panel2:#0f1116;
      --border:#232635;
      --text:#e8e8ea;
      --muted:#a8a8ad;
      --yellow:#f5c400;
      --yellow2:#ffd84d;
      --btn:#161a22;
      --btn2:#1b2030;
      --danger:#a53b3b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background: radial-gradient(900px 500px at 20% -10%, #1a1c26 0%, transparent 60%),
                  radial-gradient(800px 500px at 80% -20%, #1b1a10 0%, transparent 60%),
                  var(--bg);
    }
    .topbar{
      position:sticky; top:0; z-index:50;
      background: linear-gradient(180deg, rgba(16,18,24,.96), rgba(10,12,15,.92));
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .wrap{max-width:1200px;margin:0 auto;padding:12px 14px;}
    .brand{
      display:flex; align-items:center; gap:10px; margin-bottom:10px;
    }
    .logo-pill{
      display:inline-flex; align-items:center; gap:8px;
      border:1px solid rgba(245,196,0,.35);
      background: rgba(245,196,0,.08);
      padding:6px 10px;
      border-radius:10px;
      font-weight:700;
      color:var(--yellow2);
      letter-spacing:.2px;
    }
    .logo-dot{
      width:10px;height:10px;border-radius:50%;
      background: var(--yellow);
      box-shadow:0 0 0 3px rgba(245,196,0,.15);
    }
    .subtitle{color:var(--muted); font-size:13px}
    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      padding-bottom:6px;
    }
    .group{
      display:flex; flex-wrap:wrap;
      gap:10px;
      padding:10px;
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(16,18,24,.8), rgba(15,17,22,.8));
      border-radius:14px;
    }
    .field{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    label{
      font-size:12px;
      color:var(--muted);
      margin-right:6px;
    }
    select, button, input[type="color"]{
      height:36px;
      border-radius:12px;
      border:1px solid var(--border);
      background: linear-gradient(180deg, var(--btn), var(--btn2));
      color:var(--text);
      padding:0 12px;
      outline:none;
      font-weight:600;
    }
    select{padding-right:34px}
    button{
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    button:hover{border-color: rgba(245,196,0,.35)}
    button.primary{
      border-color: rgba(245,196,0,.35);
      background: linear-gradient(180deg, rgba(245,196,0,.18), rgba(245,196,0,.08));
      color: var(--yellow2);
    }
    button.danger{
      border-color: rgba(165,59,59,.45);
      background: linear-gradient(180deg, rgba(165,59,59,.25), rgba(165,59,59,.12));
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:0 12px; height:36px;
      border-radius:12px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    .canvas-shell{
      margin:14px auto 10px auto;
      max-width:1200px;
      padding:0 14px 14px 14px;
    }
    .canvas-card{
      border:1px solid var(--border);
      border-radius:18px;
      background: linear-gradient(180deg, rgba(16,18,24,.72), rgba(11,12,15,.72));
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .canvas-topline{
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px;
      border-bottom:1px solid rgba(35,38,53,.7);
      background: rgba(0,0,0,.18);
      gap:10px;
      flex-wrap:wrap;
    }
    .hint{color:var(--muted); font-size:12px}
    .stage{
      width:100%;
      background:#0a0b0e;
      display:flex;
      justify-content:center;
      padding:12px;
    }
    canvas{max-width:100%; height:auto; border-radius:14px}
    .notes-wrap{
      max-width:1200px;
      margin:0 auto;
      padding:0 14px 22px 14px;
    }
    .notes-card{
      border:1px solid var(--border);
      border-radius:18px;
      background: linear-gradient(180deg, rgba(16,18,24,.72), rgba(11,12,15,.72));
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .notes-title{
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    .notes-title h3{margin:0; font-size:16px; color:var(--yellow2); letter-spacing:.2px}
    textarea{
      width:100%;
      min-height:120px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(0,0,0,.25);
      color:var(--text);
      padding:12px;
      resize:vertical;
      outline:none;
      font-size:14px;
      line-height:1.35;
    }
    .export-row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }
    .icon{
      width:16px;height:16px; display:inline-block;
    }
    @media (max-width:560px){
      .export-row{justify-content:stretch}
      .export-row button{flex:1}
      select, button{width:100%}
      .field{width:100%}
      .group{width:100%}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="brand">
        <div class="logo-pill"><span class="logo-dot"></span> TactiGrid</div>
        <div>
          <div style="font-weight:800; font-size:16px; margin-bottom:2px;">TactiGrid Drill Designer</div>
          <div class="subtitle">Add equipment, draw lines, edit/transform, export to PNG/PDF.</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="group">
          <div class="field">
            <label for="pitchSelect">Pitch</label>
            <select id="pitchSelect">
              <option value="full">Full pitch</option>
              <option value="half">Half pitch</option>
              <option value="blank">Blank</option>
            </select>
          </div>

          <div class="field">
            <label>Mode</label>
            <button id="editBtn" class="primary" title="Edit/Select">
              ✏️ <span>Edit</span>
            </button>
          </div>

          <div class="field">
            <label for="objectSelect">Add Objects</label>
            <select id="objectSelect">
              <option value="player">Player</option>
              <option value="ball">Ball</option>
              <option value="cone">Cone</option>
              <option value="goal">Goal</option>
              <option value="mannequin">Mannequin</option>
              <option value="pole">Pole</option>
              <option value="flag">Flag</option>
              <option value="text">Text</option>
            </select>
          </div>

          <div class="field">
            <label for="lineSelect">Lines</label>
            <select id="lineSelect">
              <option value="straight">Straight</option>
              <option value="arrow">Arrow</option>
              <option value="dashed">Dashed</option>
              <option value="curved">Curved</option>
              <option value="free">Free draw</option>
            </select>
          </div>

          <div class="field">
            <label for="colorPicker">Colour</label>
            <input id="colorPicker" type="color" value="#ffd84d" />
          </div>
        </div>

        <div class="group">
          <div class="field">
            <label>Actions</label>
            <button id="undoBtn">↶ Undo</button>
            <button id="redoBtn">↷ Redo</button>
            <button id="clearBtn" class="danger">🗑 Clear</button>
          </div>
          <div class="pill">Tip: drag to move • use corners to resize • rotation handle to rotate • double-click text to edit</div>
        </div>
      </div>
    </div>
  </div>

  <div class="canvas-shell">
    <div class="canvas-card">
      <div class="canvas-topline">
        <div class="hint">Canvas</div>
        <div class="hint" id="modeHint">Mode: Edit (select & transform)</div>
      </div>
      <div class="stage">
        <canvas id="c" width="1100" height="650"></canvas>
      </div>
    </div>
  </div>

  <div class="notes-wrap">
    <div class="notes-card">
      <div class="notes-title">
        <h3>Notes</h3>
        <div class="export-row">
          <button id="exportPngBtn" title="Export PNG">
            <span class="icon">🖼️</span> Export PNG
          </button>
          <button id="exportPdfBtn" title="Export PDF">
            <span class="icon">📄</span> Export PDF
          </button>
        </div>
      </div>
      <textarea id="notes" placeholder="Write session notes here… (these will export with the PDF)"></textarea>
    </div>
  </div>

<script>
(() => {
  // -----------------------
  // Fabric canvas setup
  // -----------------------
  const canvas = new fabric.Canvas('c', {
    preserveObjectStacking: true,
    selection: true
  });

  // Better touch behaviour
  canvas.allowTouchScrolling = true;

  // State
  let currentColor = document.getElementById('colorPicker').value;
  let isEditMode = true;   // true = select/transform; false = placing/drawing
  let placingKind = document.getElementById('objectSelect').value;
  let lineKind = document.getElementById('lineSelect').value;

  // Undo/redo
  const undoStack = [];
  const redoStack = [];
  let isRestoring = false;

  // Background pitch group
  let pitchGroup = null;

  // For line drawing
  let drawingLine = null;
  let drawingPath = null;
  let lineStart = null;

  // Helpers
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function pushHistory() {
    if (isRestoring) return;
    const json = canvas.toDatalessJSON(['name','lockUniScaling','originX','originY']);
    undoStack.push(json);
    redoStack.length = 0;
  }

  function restoreFrom(stackFrom, stackTo) {
    if (!stackFrom.length) return;
    isRestoring = true;
    const current = canvas.toDatalessJSON(['name','lockUniScaling','originX','originY']);
    stackTo.push(current);
    const prev = stackFrom.pop();
    canvas.loadFromJSON(prev, () => {
      // re-lock pitch
      relockPitch();
      canvas.renderAll();
      isRestoring = false;
    });
  }

  document.getElementById('undoBtn').addEventListener('click', () => restoreFrom(undoStack, redoStack));
  document.getElementById('redoBtn').addEventListener('click', () => restoreFrom(redoStack, undoStack));

  document.getElementById('clearBtn').addEventListener('click', () => {
    pushHistory();
    canvas.getObjects().forEach(obj => {
      if (obj.name !== 'pitch') canvas.remove(obj);
    });
    canvas.discardActiveObject();
    canvas.requestRenderAll();
  });

  // -----------------------
  // UI bindings
  // -----------------------
  document.getElementById('colorPicker').addEventListener('input', (e) => {
    currentColor = e.target.value;
    const active = canvas.getActiveObject();
    if (active && active.name !== 'pitch') {
      pushHistory();
      if (active.type === 'group' || active.type === 'path' || active.type === 'polyline' || active.type === 'line') {
        // stroke-based
        if (active.stroke) active.set('stroke', currentColor);
        if (active.fill && active.fill !== 'transparent') active.set('fill', currentColor);
      } else {
        if (active.fill) active.set('fill', currentColor);
        if (active.stroke) active.set('stroke', currentColor);
      }
      canvas.requestRenderAll();
    }
  });

  document.getElementById('objectSelect').addEventListener('change', (e) => {
    placingKind = e.target.value;
    // If you pick an object, go to add mode automatically (keeps your current behaviour)
    setMode(false);
  });

  document.getElementById('lineSelect').addEventListener('change', (e) => {
    lineKind = e.target.value;
    setMode(false);
  });

  document.getElementById('editBtn').addEventListener('click', () => {
    setMode(true);
  });

  function setMode(edit) {
    isEditMode = edit;
    canvas.isDrawingMode = (!isEditMode && lineKind === 'free');
    canvas.selection = isEditMode;
    canvas.forEachObject(obj => {
      if (obj.name === 'pitch') return;
      obj.selectable = isEditMode;
      obj.evented = true;
    });
    document.getElementById('modeHint').textContent = isEditMode
      ? 'Mode: Edit (select & transform)'
      : (lineKind === 'free' ? 'Mode: Free draw' : 'Mode: Add/Draw');
    // Button style
    document.getElementById('editBtn').classList.toggle('primary', isEditMode);
  }

  // -----------------------
  // Pitch drawing (VECTOR)
  // Fixes: pitch not showing + random corner arcs removed
  // Half pitch = exactly half (like v1)
  // -----------------------
  const pitchSelect = document.getElementById('pitchSelect');
  pitchSelect.addEventListener('change', () => {
    pushHistory();
    drawPitch(pitchSelect.value);
  });

  function relockPitch() {
    canvas.forEachObject(obj => {
      if (obj.name === 'pitch') {
        obj.selectable = false;
        obj.evented = false;
        obj.hasControls = false;
        obj.hoverCursor = 'default';
        obj.lockMovementX = obj.lockMovementY = true;
        obj.lockScalingX = obj.lockScalingY = true;
        obj.lockRotation = true;
      }
    });
  }

  function drawPitch(type) {
    // Remove existing pitch group
    canvas.getObjects().forEach(obj => {
      if (obj.name === 'pitch') canvas.remove(obj);
    });

    const W = canvas.getWidth();
    const H = canvas.getHeight();

    // Blank pitch means no green background lines at all.
    if (type === 'blank') {
      canvas.setBackgroundColor('#0a0b0e', canvas.renderAll.bind(canvas));
      canvas.requestRenderAll();
      return;
    }

    // Pitch base
    const pad = 55;
    const x0 = pad;
    const y0 = pad;
    const x1 = W - pad;
    const y1 = H - pad;

    // For half pitch (left half), we draw only one half-width area.
    // (This matches your v1 “one half of the pitch” behaviour.)
    const fullWidth = x1 - x0;
    const halfX1 = x0 + fullWidth/2;

    const pitchRect = (type === 'half')
      ? { x0, y0, x1: halfX1, y1 }
      : { x0, y0, x1, y1 };

    // Background colour + subtle stripes (vector rectangles)
    canvas.setBackgroundColor('#0a0b0e', () => {});

    const stripes = [];
    const stripeCount = 12;
    const pw = pitchRect.x1 - pitchRect.x0;
    const ph = pitchRect.y1 - pitchRect.y0;

    for (let i=0;i<stripeCount;i++){
      const sx = pitchRect.x0 + (pw/stripeCount)*i;
      stripes.push(new fabric.Rect({
        left: sx,
        top: pitchRect.y0,
        width: pw/stripeCount + 1,
        height: ph,
        fill: (i%2===0) ? 'rgba(58,134,86,.55)' : 'rgba(50,122,78,.55)',
        selectable:false, evented:false
      }));
    }

    const outer = new fabric.Rect({
      left: pitchRect.x0, top: pitchRect.y0,
      width: pw, height: ph,
      fill: 'rgba(0,0,0,0)',
      stroke: 'rgba(235,235,235,.85)',
      strokeWidth: 3,
      selectable:false, evented:false
    });

    const markings = [];

    // halfway line & center circle only for full pitch
    if (type === 'full') {
      const midX = (pitchRect.x0 + pitchRect.x1)/2;
      markings.push(new fabric.Line([midX, pitchRect.y0, midX, pitchRect.y1], {
        stroke: 'rgba(235,235,235,.85)', strokeWidth: 3,
        selectable:false, evented:false
      }));
      const centerY = (pitchRect.y0 + pitchRect.y1)/2;
      markings.push(new fabric.Circle({
        left: midX, top: centerY,
        originX:'center', originY:'center',
        radius: Math.min(pw,ph)*0.12,
        fill:'rgba(0,0,0,0)',
        stroke:'rgba(235,235,235,.85)',
        strokeWidth:3,
        selectable:false, evented:false
      }));
      markings.push(new fabric.Circle({
        left: midX, top: centerY,
        originX:'center', originY:'center',
        radius: 3.5,
        fill:'rgba(235,235,235,.85)',
        selectable:false, evented:false
      }));
    }

    // Right-side penalty box + 6-yard box for full/half (since half is left half, we put the goal on the RIGHT edge of that half)
    // This matches your screenshot where the goal is on the right side.
    const goalX = pitchRect.x1;
    const centerY = (pitchRect.y0 + pitchRect.y1)/2;

    // Penalty box dims relative
    const penDepth = pw * 0.18;
    const penWidth = ph * 0.55;
    const sixDepth = pw * 0.07;
    const sixWidth = ph * 0.28;

    // Penalty area
    markings.push(new fabric.Rect({
      left: goalX - penDepth,
      top: centerY - penWidth/2,
      width: penDepth,
      height: penWidth,
      fill:'rgba(0,0,0,0)',
      stroke:'rgba(235,235,235,.85)',
      strokeWidth:3,
      selectable:false, evented:false
    }));

    // 6-yard area
    markings.push(new fabric.Rect({
      left: goalX - sixDepth,
      top: centerY - sixWidth/2,
      width: sixDepth,
      height: sixWidth,
      fill:'rgba(0,0,0,0)',
      stroke:'rgba(235,235,235,.85)',
      strokeWidth:3,
      selectable:false, evented:false
    }));

    // Penalty spot
    markings.push(new fabric.Circle({
      left: goalX - penDepth*0.60,
      top: centerY,
      originX:'center', originY:'center',
      radius: 3.5,
      fill:'rgba(235,235,235,.85)',
      selectable:false, evented:false
    }));

    // Penalty arc ("D") — keep it (not corner arcs). No corner semi-circles drawn.
    const dRadius = ph * 0.16;
    const dCenterX = goalX - penDepth*0.60;
    const arc = new fabric.Path(
      `M ${dCenterX - dRadius} ${centerY}
       A ${dRadius} ${dRadius} 0 0 1 ${dCenterX + dRadius} ${centerY}`,
      {
        fill:'',
        stroke:'rgba(235,235,235,.85)',
        strokeWidth:3,
        selectable:false, evented:false
      }
    );
    // Clip the arc so only the outside half shows (like a "D")
    // We do this by masking it with a rect that sits outside the box.
    const mask = new fabric.Rect({
      left: dCenterX,
      top: centerY - dRadius - 10,
      width: dRadius + 20,
      height: dRadius*2 + 20,
      selectable:false, evented:false
    });
    arc.clipPath = mask;
    markings.push(arc);

    // Goal frame (on pitch background only)
    const goalW = ph * 0.16;
    const goalDepth = pw * 0.03;
    markings.push(new fabric.Rect({
      left: goalX - goalDepth,
      top: centerY - goalW/2,
      width: goalDepth,
      height: goalW,
      fill:'rgba(0,0,0,0)',
      stroke:'rgba(235,235,235,.85)',
      strokeWidth:3,
      selectable:false, evented:false
    }));

    pitchGroup = new fabric.Group([...stripes, outer, ...markings], {
      name:'pitch',
      selectable:false,
      evented:false,
      left:0, top:0
    });

    canvas.add(pitchGroup);
    canvas.sendToBack(pitchGroup);
    relockPitch();
    canvas.requestRenderAll();
  }

  // Initial pitch
  drawPitch(pitchSelect.value);

  // -----------------------
  // Icons (SVG data)
  // -----------------------
  function svgDataUri(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  const ICONS = {
    player: svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
        <defs>
          <radialGradient id="g" cx="35%" cy="30%" r="70%">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="45" cy="45" r="28" fill="${currentColor}" />
        <circle cx="45" cy="45" r="28" fill="url(#g)"/>
        <circle cx="45" cy="45" r="30" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>
      </svg>`),
    cone: svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
        <path d="M45 12 L65 70 H25 Z" fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
        <rect x="22" y="70" width="46" height="10" rx="4" fill="rgba(0,0,0,.25)"/>
      </svg>`),
    ball: svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
        <circle cx="45" cy="45" r="28" fill="#ffffff" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
        <polygon points="45,28 54,35 50,46 40,46 36,35" fill="rgba(0,0,0,.75)"/>
        <path d="M36 35 L28 42 L31 55 L40 46" fill="rgba(0,0,0,.12)"/>
        <path d="M54 35 L62 42 L59 55 L50 46" fill="rgba(0,0,0,.12)"/>
        <path d="M40 46 L31 55 L45 62 L59 55 L50 46" fill="rgba(0,0,0,.12)"/>
      </svg>`),
    goal: svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" width="120" height="90" viewBox="0 0 120 90">
        <rect x="18" y="18" width="84" height="54" fill="rgba(255,255,255,.08)" stroke="rgba(235,235,235,.95)" stroke-width="4"/>
        <line x1="18" y1="36" x2="102" y2="36" stroke="rgba(235,235,235,.35)" stroke-width="2"/>
        <line x1="18" y1="54" x2="102" y2="54" stroke="rgba(235,235,235,.35)" stroke-width="2"/>
        <line x1="36" y1="18" x2="36" y2="72" stroke="rgba(235,235,235,.35)" stroke-width="2"/>
        <line x1="54" y1="18" x2="54" y2="72" stroke="rgba(235,235,235,.35)" stroke-width="2"/>
        <line x1="72" y1="18" x2="72" y2="72" stroke="rgba(235,235,235,.35)" stroke-width="2"/>
        <line x1="90" y1="18" x2="90" y2="72" stroke="rgba(235,235,235,.35)" stroke-width="2"/>
      </svg>`),
    mannequin: svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" width="90" height="120" viewBox="0 0 90 120">
        <rect x="34" y="10" width="22" height="12" rx="6" fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
        <path d="M25 28 Q45 18 65 28 L58 104 Q45 112 32 104 Z"
              fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
        <rect x="24" y="104" width="42" height="10" rx="4" fill="rgba(0,0,0,.25)"/>
      </svg>`),
    pole: svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="140" viewBox="0 0 40 140">
        <rect x="17" y="10" width="6" height="110" rx="3" fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
        <rect x="8" y="120" width="24" height="10" rx="5" fill="rgba(0,0,0,.25)"/>
      </svg>`),
    flag: svgDataUri(`
      <svg xmlns="http://www.w3.org/2000/svg" width="80" height="140" viewBox="0 0 80 140">
        <rect x="22" y="16" width="6" height="108" rx="3" fill="rgba(235,235,235,.9)" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
        <path d="M28 20
                 C 45 18, 52 26, 68 22
                 L 68 52
                 C 52 56, 45 48, 28 50 Z"
              fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
        <rect x="14" y="124" width="22" height="10" rx="5" fill="rgba(0,0,0,.25)"/>
      </svg>`)
  };

  function makeIcon(kind, x, y) {
    // Refresh icon color-dependent svgs
    if (['player','cone','mannequin','pole','flag'].includes(kind)) {
      // regenerate with currentColor
      // easiest: replace fill in existing SVG? We'll just rebuild using ICONS by re-calling svgDataUri strings.
      // For simplicity and reliability: rebuild those icons on the fly:
    }

    const svgMap = {
      player: () => svgDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
          <defs>
            <radialGradient id="g" cx="35%" cy="30%" r="70%">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
              <stop offset="1" stop-color="#000000" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="45" cy="45" r="28" fill="${currentColor}" />
          <circle cx="45" cy="45" r="28" fill="url(#g)"/>
          <circle cx="45" cy="45" r="30" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="3"/>
        </svg>`),
      cone: () => svgDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
          <path d="M45 12 L65 70 H25 Z" fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
          <rect x="22" y="70" width="46" height="10" rx="4" fill="rgba(0,0,0,.25)"/>
        </svg>`),
      ball: () => ICONS.ball,
      goal: () => ICONS.goal,
      mannequin: () => svgDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" width="90" height="120" viewBox="0 0 90 120">
          <rect x="34" y="10" width="22" height="12" rx="6" fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
          <path d="M25 28 Q45 18 65 28 L58 104 Q45 112 32 104 Z"
                fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
          <rect x="24" y="104" width="42" height="10" rx="4" fill="rgba(0,0,0,.25)"/>
        </svg>`),
      pole: () => svgDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="140" viewBox="0 0 40 140">
          <rect x="17" y="10" width="6" height="110" rx="3" fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
          <rect x="8" y="120" width="24" height="10" rx="5" fill="rgba(0,0,0,.25)"/>
        </svg>`),
      flag: () => svgDataUri(`
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="140" viewBox="0 0 80 140">
          <rect x="22" y="16" width="6" height="108" rx="3" fill="rgba(235,235,235,.9)" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
          <path d="M28 20
                   C 45 18, 52 26, 68 22
                   L 68 52
                   C 52 56, 45 48, 28 50 Z"
                fill="${currentColor}" stroke="rgba(0,0,0,.25)" stroke-width="3"/>
          <rect x="14" y="124" width="22" height="10" rx="5" fill="rgba(0,0,0,.25)"/>
        </svg>`)
    };

    const uri = svgMap[kind] ? svgMap[kind]() : ICONS.cone;

    return new Promise((resolve) => {
      fabric.loadSVGFromURL(uri, (objects, options) => {
        const obj = fabric.util.groupSVGElements(objects, options);
        obj.set({
          left: x,
          top: y,
          originX: 'center',
          originY: 'center',
          name: kind,
          cornerStyle: 'circle',
          cornerColor: '#ffd84d',
          transparentCorners: false,
          borderColor: 'rgba(255,216,77,.7)',
          lockUniScaling: false
        });

        // Default sizing per type
        let scale = 0.55;
        if (kind === 'goal') scale = 0.55;
        if (kind === 'pole') scale = 0.55;
        if (kind === 'flag') scale = 0.55;
        obj.scale(scale);

        resolve(obj);
      });
    });
  }

  function addText(x,y){
    const t = new fabric.IText('Text', {
      left: x, top: y,
      originX:'center', originY:'center',
      fill: currentColor,
      fontSize: 26,
      fontWeight: 700,
      name:'text',
      editable: true
    });
    t.setControlsVisibility({ mtr:true });
    return t;
  }

  // -----------------------
  // Click to place objects
  // -----------------------
  canvas.on('mouse:down', async (opt) => {
    if (isEditMode) return;

    const pointer = canvas.getPointer(opt.e);
    const x = pointer.x;
    const y = pointer.y;

    // Free draw handled by fabric drawing mode
    if (lineKind === 'free') return;

    // If clicking on object in add mode, ignore (prevents accidental adds)
    const target = opt.target;
    if (target && target.name !== 'pitch') return;

    // Line drawing
    if (['straight','arrow','dashed','curved'].includes(lineKind)) {
      lineStart = {x,y};
      if (lineKind === 'curved') {
        // temporary quadratic curve using Path with control point mid
        drawingLine = new fabric.Path(`M ${x} ${y} Q ${x} ${y} ${x} ${y}`, {
          stroke: currentColor,
          fill: '',
          strokeWidth: 5,
          selectable: false,
          evented: false,
          name: 'line'
        });
        canvas.add(drawingLine);
      } else {
        drawingLine = new fabric.Line([x,y,x,y], {
          stroke: currentColor,
          strokeWidth: 5,
          selectable:false,
          evented:false,
          name:'line'
        });
        if (lineKind === 'dashed') drawingLine.set({ strokeDashArray:[14,10] });
        canvas.add(drawingLine);
      }
      canvas.requestRenderAll();
      return;
    }

    // Place object
    pushHistory();
    if (placingKind === 'text') {
      const t = addText(x,y);
      canvas.add(t);
      canvas.setActiveObject(t);
      canvas.requestRenderAll();
      // Immediately edit on mobile/desktop
      setTimeout(()=> t.enterEditing(), 0);
      return;
    }

    const obj = await makeIcon(placingKind, x, y);
    canvas.add(obj);
    canvas.setActiveObject(obj);
    canvas.requestRenderAll();
  });

  canvas.on('mouse:move', (opt) => {
    if (isEditMode) return;
    if (!drawingLine || !lineStart) return;

    const p = canvas.getPointer(opt.e);
    const x2 = p.x;
    const y2 = p.y;

    if (lineKind === 'curved') {
      // Control point: mid + perpendicular offset
      const mx = (lineStart.x + x2)/2;
      const my = (lineStart.y + y2)/2;
      const dx = x2 - lineStart.x;
      const dy = y2 - lineStart.y;
      const len = Math.max(1, Math.hypot(dx,dy));
      const nx = -dy/len;
      const ny = dx/len;
      const bend = 70; // curve intensity
      const cx = mx + nx*bend;
      const cy = my + ny*bend;
      drawingLine.set({ path: [
        ['M', lineStart.x, lineStart.y],
        ['Q', cx, cy, x2, y2]
      ]});
    } else {
      drawingLine.set({ x2, y2 });
    }

    canvas.requestRenderAll();
  });

  canvas.on('mouse:up', () => {
    if (isEditMode) return;
    if (!drawingLine) return;

    // Finalize line, add arrow head if needed
    pushHistory();

    if (lineKind === 'arrow') {
      const x1 = drawingLine.x1, y1 = drawingLine.y1, x2 = drawingLine.x2, y2 = drawingLine.y2;
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = 18;
      const hx1 = x2 - headLen * Math.cos(angle - Math.PI/7);
      const hy1 = y2 - headLen * Math.sin(angle - Math.PI/7);
      const hx2 = x2 - headLen * Math.cos(angle + Math.PI/7);
      const hy2 = y2 - headLen * Math.sin(angle + Math.PI/7);

      const head = new fabric.Polygon(
        [{x:x2,y:y2},{x:hx1,y:hy1},{x:hx2,y:hy2}],
        { fill: currentColor, selectable:false, evented:false, name:'arrowHead' }
      );

      const grp = new fabric.Group([drawingLine, head], {
        name:'lineGroup',
        selectable: false,
        evented: false
      });
      canvas.remove(drawingLine);
      canvas.add(grp);
    }

    drawingLine = null;
    lineStart = null;
  });

  // Enable free drawing brush
  canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
  canvas.freeDrawingBrush.width = 4;
  canvas.freeDrawingBrush.color = currentColor;

  canvas.on('path:created', (e) => {
    // When free draw completes
    pushHistory();
    e.path.set({ stroke: currentColor, name:'freeLine' });
  });

  // Keep brush colour updated
  document.getElementById('colorPicker').addEventListener('input', () => {
    canvas.freeDrawingBrush.color = currentColor;
  });

  // Default to Edit mode on load
  setMode(true);

  // -----------------------
  // Export (branding in BLACK)
  // PNG exports what you see (including pitch) as an image
  // PDF includes branding + notes
  // -----------------------
  function cloneCanvasWithBrandingBlack(cb) {
    canvas.clone((cloned) => {
      // Ensure same size
      cloned.setWidth(canvas.getWidth());
      cloned.setHeight(canvas.getHeight());

      // Add black branding in top-left as a small label
      const brand = new fabric.Text('TactiGrid', {
        left: 18,
        top: 14,
        fontSize: 20,
        fontWeight: 900,
        fill: '#000000',
        backgroundColor: 'rgba(255,255,255,.75)',
        padding: 6,
        selectable: false,
        evented: false
      });

      // Fabric v5 doesn't support padding on Text in all builds; simulate with a rect behind.
      const bg = new fabric.Rect({
        left: 10, top: 8,
        width: 110, height: 34,
        fill: 'rgba(255,255,255,.75)',
        rx: 10, ry: 10,
        selectable:false, evented:false
      });

      const label = new fabric.Group([bg, brand], {
        left: 0, top: 0, selectable:false, evented:false
      });

      cloned.add(label);
      cloned.bringToFront(label);
      cloned.renderAll();
      cb(cloned);
    });
  }

  document.getElementById('exportPngBtn').addEventListener('click', () => {
    cloneCanvasWithBrandingBlack((cloned) => {
      const data = cloned.toDataURL({ format:'png', multiplier: 2 });
      const a = document.createElement('a');
      a.href = data;
      a.download = 'tactigrid-drill.png';
      a.click();
    });
  });

  document.getElementById('exportPdfBtn').addEventListener('click', () => {
    const notes = (document.getElementById('notes').value || '').trim();

    cloneCanvasWithBrandingBlack((cloned) => {
      const data = cloned.toDataURL({ format:'png', multiplier: 2 });

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });

      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();

      // Fit image with margins
      const margin = 32;
      const imgMaxW = pageW - margin*2;
      const imgMaxH = pageH * 0.68; // leave room for notes
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(imgMaxW / img.width, imgMaxH / img.height);
        const imgW = img.width * ratio;
        const imgH = img.height * ratio;
        const x = (pageW - imgW)/2;
        const y = margin;

        pdf.addImage(data, 'PNG', x, y, imgW, imgH);

        // Notes
        const notesTop = y + imgH + 20;
        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(14);
        pdf.setTextColor(0,0,0);
        pdf.text('Notes', margin, notesTop);

        pdf.setFont('helvetica', 'normal');
        pdf.setFontSize(11);

        const wrapWidth = pageW - margin*2;
        const lines = pdf.splitTextToSize(notes || '—', wrapWidth);
        pdf.text(lines, margin, notesTop + 18);

        pdf.save('tactigrid-drill.pdf');
      };
      img.src = data;
    });
  });

  // -----------------------
  // Keyboard helpers
  // -----------------------
  document.addEventListener('keydown', (e) => {
    const active = canvas.getActiveObject();
    if (active && active.isEditing) return;

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      restoreFrom(undoStack, redoStack);
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      restoreFrom(redoStack, undoStack);
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (active && active.name !== 'pitch') {
        pushHistory();
        canvas.remove(active);
        canvas.discardActiveObject();
        canvas.requestRenderAll();
      }
    }
  });

})();
</script>
</body>
</html>
