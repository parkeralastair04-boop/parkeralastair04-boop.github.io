<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TactiGrid Drill Designer</title>

  <!-- Fabric.js -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <!-- jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <style>
    :root{
      --bg:#0b0b0f;
      --panel:#11121a;
      --panel2:#0f1017;
      --text:#f3f3f3;
      --muted:#b8b8b8;
      --yellow:#ffd400;
      --border:rgba(255,255,255,0.10);
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 14px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(255,212,0,0.10), transparent 55%),
                  radial-gradient(1000px 600px at 100% 0%, rgba(255,212,0,0.06), transparent 55%),
                  var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    header{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      user-select:none;
      min-width: 0;
    }

    /* ✅ logo image (your generated logo) */
    .brandLogo{
      height: 42px;
      width: auto;
      display:block;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .brandText{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .brand h1{
      font-size: 18px;
      margin:0;
      letter-spacing: 0.2px;
      font-weight: 800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand .sub{
      margin:0;
      font-size: 12px;
      color: var(--muted);
      margin-top:2px;
    }

    .topControls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 70%),
                  var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar{
      display:flex;
      gap:10px;
      padding: 12px;
      align-items:center;
      flex-wrap:wrap;
    }

    .group{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding: 6px 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
    }

    label{
      font-size: 12px;
      color: var(--muted);
      margin-right: 4px;
      white-space:nowrap;
    }

    select, input[type="color"], input[type="text"], textarea{
      background: var(--panel2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 10px 10px;
      outline:none;
      font-size: 14px;
    }

    input[type="color"]{
      padding: 0;
      width: 44px;
      height: 38px;
      border-radius: 10px;
    }

    input[type="text"]{
      height: 38px;
      min-width: 180px;
    }

    .btn{
      appearance:none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 700;
      display:inline-flex;
      gap:10px;
      align-items:center;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
      user-select:none;
    }
    .btn:hover{
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.18);
    }
    .btn:active{ transform: translateY(1px); }

    .btn.primary{
      background: rgba(255,212,0,0.14);
      border-color: rgba(255,212,0,0.35);
    }
    .btn.primary:hover{
      background: rgba(255,212,0,0.18);
      border-color: rgba(255,212,0,0.55);
    }

    .btn.icon{
      padding: 10px 12px;
      min-width: 44px;
      justify-content:center;
    }

    .btn.active{
      outline: 2px solid rgba(255,212,0,0.55);
      outline-offset: 1px;
    }

    .ico{
      width: 18px; height: 18px; display:inline-block;
    }

    /* ✅ Notes/export UNDER the canvas now */
    .stack{
      display:flex;
      flex-direction:column;
      gap: 14px;
      margin-top: 14px;
    }

    .canvasPanel{ padding: 12px; }

    .canvasFrame{
      width:100%;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0a0a0d;
      touch-action: none;
    }

    canvas{ display:block; }

    .hint{
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.35;
    }

    .notesPanel{ padding: 12px; }
    .notesPanel h2{
      margin: 0 0 8px 0;
      font-size: 14px;
      letter-spacing:0.2px;
    }
    textarea{
      width:100%;
      min-height: 120px;
      resize: vertical;
      line-height: 1.35;
    }

    .exportRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <!-- ✅ Put your generated black-background logo in the repo as tactigrid-logo.png -->
        <img class="brandLogo" src="tactigrid-logo.png" alt="TactiGrid logo" />
        <div class="brandText">
          <h1>TactiGrid Drill Designer</h1>
          <p class="sub">Design drills, add notes, export PNG/PDF</p>
        </div>
      </div>

      <div class="topControls">
        <button class="btn icon" id="zoomOutBtn" title="Zoom out"><span class="ico">➖</span></button>
        <button class="btn icon" id="zoomResetBtn" title="Reset view"><span class="ico">⤾</span></button>
        <button class="btn icon" id="zoomInBtn" title="Zoom in"><span class="ico">➕</span></button>
      </div>
    </header>

    <div class="panel toolbar" role="region" aria-label="Toolbar">
      <div class="group">
        <button class="btn primary active" id="addModeBtn" title="Add objects/lines">
          <span class="ico" aria-hidden="true">➕</span>
          Add
        </button>
        <button class="btn" id="editModeBtn" title="Edit (select/move/resize/rotate)">
          <span class="ico" aria-hidden="true">✏️</span>
          Edit
        </button>
      </div>

      <div class="group" id="addControls">
        <label for="addType">Add</label>
        <select id="addType">
          <option value="player">Player</option>
          <option value="ball" selected>Ball</option>
          <option value="cone">Cone</option>
          <option value="goal">Goal</option>
          <option value="mannequin">Mannequin</option>
          <option value="pole">Pole</option>
          <option value="flag">Flag</option>
          <option value="text">Text</option>
        </select>

        <label for="lineType">Line</label>
        <select id="lineType">
          <option value="none" selected>—</option>
          <option value="straight">Straight</option>
          <option value="arrow">Arrow</option>
          <option value="dashed">Dashed</option>
          <option value="curved">Curved</option>
          <option value="free">Free Draw</option>
        </select>

        <label for="strokeColor">Colour</label>
        <input type="color" id="strokeColor" value="#ffd400" />

        <!-- ✅ Player label default -->
        <label for="playerLabel">Player label</label>
        <input type="text" id="playerLabel" placeholder="e.g. 7 / Al / GK" />
      </div>

      <div class="group">
        <button class="btn" id="undoBtn" title="Undo">Undo</button>
        <button class="btn" id="redoBtn" title="Redo">Redo</button>
        <button class="btn" id="clearBtn" title="Clear all">Clear</button>
      </div>
    </div>

    <div class="stack">
      <div class="panel canvasPanel">
        <div class="canvasFrame" id="canvasFrame">
          <canvas id="c"></canvas>
        </div>
        <div class="hint">
          Tips: Use <b>Edit</b> to move/resize/rotate. Pinch to zoom on mobile. Two-finger drag to pan.
          Double-click a <b>player</b> in Edit to rename it.
        </div>
      </div>

      <!-- ✅ Notes + export buttons now UNDER the tool -->
      <div class="panel notesPanel">
        <h2>Notes</h2>
        <textarea id="notes" placeholder="Write session notes here... (included in PDF export)"></textarea>

        <div class="exportRow">
          <button class="btn primary" id="exportPngBtn" title="Export PNG">
            <span class="ico" aria-hidden="true">🖼️</span>
            Export PNG
          </button>
          <button class="btn primary" id="exportPdfBtn" title="Export PDF">
            <span class="ico" aria-hidden="true">📄</span>
            Export PDF
          </button>
        </div>

        <div class="hint">
          Export branding is included in <b>black</b> on the output.
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const frameEl  = document.getElementById('canvasFrame');

  const canvas = new fabric.Canvas('c', {
    backgroundColor: '#0a0a0d',
    selection: false,
    preserveObjectStacking: true,
    stopContextMenu: true
  });

  let pitchGroup = null;

  let mode = 'add';
  let addType = document.getElementById('addType').value;
  let lineType = 'none';
  let strokeColor = document.getElementById('strokeColor').value;

  let undoStack = [];
  let redoStack = [];
  const MAX_STACK = 40;

  function pushHistory() {
    redoStack.length = 0;
    const json = canvas.toJSON(['isPitch','isPlayer','playerText']);
    undoStack.push(json);
    if (undoStack.length > MAX_STACK) undoStack.shift();
  }

  function loadFrom(json) {
    canvas.loadFromJSON(json, () => {
      canvas.getObjects().forEach(o => {
        if (o.isPitch) {
          o.selectable = false;
          o.evented = false;
          o.excludeFromExport = false;
        }
      });
      canvas.requestRenderAll();
    });
  }

  function resetHistory() {
    undoStack = [];
    redoStack = [];
    pushHistory();
  }

  // --- CANVAS SIZE (landscape) ---
  function fitCanvasToFrame() {
    const r = frameEl.getBoundingClientRect();
    const w = Math.max(320, Math.floor(r.width));
    const h = Math.floor(w * 0.58);
    canvas.setWidth(w);
    canvas.setHeight(h);
    canvas.calcOffset();
    canvas.requestRenderAll();
  }

  function clearPitchOnly() {
    if (!pitchGroup) return;
    canvas.remove(pitchGroup);
    pitchGroup = null;
  }

  // ✅ PITCH: Landscape with goals LEFT + RIGHT, halfway line VERTICAL
  function makeFullPitch() {
    clearPitchOnly();

    const W = canvas.getWidth();
    const H = canvas.getHeight();
    const margin = Math.max(18, Math.floor(Math.min(W,H) * 0.04));

    const pitchFill = '#1d6a3a';
    const pitchStripe = '#1a6135';
    const lineColor = '#f7f7f7';

    const field = new fabric.Rect({
      left: margin,
      top: margin,
      width: W - margin*2,
      height: H - margin*2,
      fill: pitchFill,
      rx: 6, ry: 6,
      selectable: false,
      evented: false
    });

    // vertical stripes
    const stripes = [];
    const stripeCount = 14;
    const stripeW = field.width / stripeCount;
    for (let i=0;i<stripeCount;i++){
      stripes.push(new fabric.Rect({
        left: field.left + i*stripeW,
        top: field.top,
        width: stripeW,
        height: field.height,
        fill: i%2===0 ? pitchFill : pitchStripe,
        selectable:false,
        evented:false
      }));
    }

    const L = (x1,y1,x2,y2) => new fabric.Line([x1,y1,x2,y2], {
      stroke: lineColor, strokeWidth: 2, selectable:false, evented:false
    });

    const R = (opts) => new fabric.Rect({
      fill: 'transparent',
      stroke: lineColor,
      strokeWidth: 2,
      selectable:false,
      evented:false,
      ...opts
    });

    const C = (opts) => new fabric.Circle({
      fill: 'transparent',
      stroke: lineColor,
      strokeWidth: 2,
      selectable:false,
      evented:false,
      ...opts
    });

    const objs = [...stripes, field];

    // Boundary
    objs.push(R({ left: field.left, top: field.top, width: field.width, height: field.height }));

    // Halfway line (vertical)
    objs.push(L(field.left + field.width/2, field.top, field.left + field.width/2, field.top + field.height));

    // Centre circle + spot
    const ccR = Math.min(field.width, field.height) * 0.12;
    objs.push(C({ left: field.left + field.width/2 - ccR, top: field.top + field.height/2 - ccR, radius: ccR }));
    objs.push(new fabric.Circle({
      left: field.left + field.width/2 - 2,
      top: field.top + field.height/2 - 2,
      radius: 2,
      fill: lineColor,
      stroke: lineColor,
      selectable:false, evented:false
    }));

    // Boxes + goals LEFT / RIGHT
    const boxH = field.height * 0.55;
    const boxW = field.width * 0.18;
    const sixH = field.height * 0.30;
    const sixW = field.width * 0.07;
    const goalH = field.height * 0.18;
    const goalW = field.width * 0.02;
    const midY = field.top + field.height/2;

    // Left end
    objs.push(R({ left: field.left, top: midY - boxH/2, width: boxW, height: boxH }));
    objs.push(R({ left: field.left, top: midY - sixH/2, width: sixW, height: sixH }));
    objs.push(R({ left: field.left - goalW, top: midY - goalH/2, width: goalW, height: goalH }));
    objs.push(new fabric.Circle({
      left: field.left + boxW*0.62 - 2,
      top: midY - 2,
      radius: 2,
      fill: lineColor,
      stroke: lineColor,
      selectable:false, evented:false
    }));

    // Right end
    objs.push(R({ left: field.left + field.width - boxW, top: midY - boxH/2, width: boxW, height: boxH }));
    objs.push(R({ left: field.left + field.width - sixW, top: midY - sixH/2, width: sixW, height: sixH }));
    objs.push(R({ left: field.left + field.width, top: midY - goalH/2, width: goalW, height: goalH }));
    objs.push(new fabric.Circle({
      left: field.left + field.width - boxW*0.62 - 2,
      top: midY - 2,
      radius: 2,
      fill: lineColor,
      stroke: lineColor,
      selectable:false, evented:false
    }));

    pitchGroup = new fabric.Group(objs, { selectable:false, evented:false });
    pitchGroup.isPitch = true;
    pitchGroup.excludeFromExport = false;

    canvas.add(pitchGroup);
    canvas.sendToBack(pitchGroup);
    canvas.requestRenderAll();
  }

  function rebuildPitchPreserveObjects() {
    const keep = canvas.getObjects().filter(o => !o.isPitch);
    clearPitchOnly();
    fitCanvasToFrame();
    makeFullPitch();
    keep.forEach(o => canvas.add(o));
    canvas.requestRenderAll();
  }

  // --- Helpers ---
  function normalizeNewObject(o){
    o.set({
      cornerColor: '#ffd400',
      cornerStrokeColor: '#111',
      borderColor: 'rgba(255,212,0,0.8)',
      cornerSize: 10,
      transparentCorners: false,
      padding: 2
    });
    return o;
  }

  function hexToRgb(hex){
    const h = hex.replace('#','').trim();
    const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
    const num = parseInt(full, 16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  function bestTextColor(bgHex){
    const {r,g,b} = hexToRgb(bgHex);
    const luminance = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
    return luminance > 0.6 ? '#111' : '#fff';
  }

  // --- Objects (now use colour picker) ---
  function makePlayer(x,y, fillHex, labelText){
    const circle = new fabric.Circle({
      left: x-16, top: y-16, radius: 16,
      fill: fillHex,
      stroke: '#111',
      strokeWidth: 2
    });

    const label = new fabric.Text(labelText || '', {
      left: x, top: y,
      originX:'center', originY:'center',
      fill: bestTextColor(fillHex),
      fontSize: 14,
      fontWeight: '800',
      selectable:false,
      evented:false
    });

    const g = new fabric.Group([circle, label], {
      left: x, top: y,
      originX:'center', originY:'center'
    });

    g.isPlayer = true;
    g.playerText = labelText || '';
    return g;
  }

  // ball (works reliably)
  function makeFootball(x, y) {
    const r = 16;
    const base = new fabric.Circle({
      left: 0, top: 0,
      originX: 'center', originY: 'center',
      radius: r,
      fill: '#ffffff',
      stroke: '#111',
      strokeWidth: 2
    });

    const pent = new fabric.Path(
      'M 0 -6 L 5 -2 L 3 5 L -3 5 L -5 -2 Z',
      {
        left: 0, top: 0,
        originX: 'center', originY: 'center',
        fill: '#111',
        stroke: '#111',
        strokeWidth: 1
      }
    );

    const patch = (dx, dy, pr) => new fabric.Circle({
      left: dx, top: dy,
      originX: 'center', originY: 'center',
      radius: pr,
      fill: '#111'
    });

    const patches = [
      patch(0, -10, 3.2),
      patch(9, -3,  3.0),
      patch(6,  9,  3.1),
      patch(-6, 9,  3.1),
      patch(-9,-3,  3.0),
    ];

    const seam = new fabric.Circle({
      left: 0, top: 0,
      originX: 'center', originY: 'center',
      radius: r,
      fill: 'transparent',
      stroke: 'rgba(0,0,0,0.25)',
      strokeWidth: 1
    });

    return new fabric.Group([base, seam, pent, ...patches], {
      left: x, top: y,
      originX:'center', originY:'center'
    });
  }

  function makeCone(x,y, fillHex){
    return new fabric.Triangle({
      left: x-14, top: y-16, width: 28, height: 32,
      fill: fillHex,
      stroke: '#111',
      strokeWidth: 2
    });
  }

  function makeMannequin(x,y, fillHex){
    const head = new fabric.Circle({
      left: -7, top: -26, radius: 7,
      fill: fillHex,
      stroke: '#111',
      strokeWidth: 2
    });
    const body = new fabric.Rect({
      left: -10, top: -18,
      width: 20, height: 48,
      rx: 8, ry: 8,
      fill: fillHex,
      stroke: '#111',
      strokeWidth: 2
    });
    return new fabric.Group([body, head], { left:x, top:y, originX:'center', originY:'center' });
  }

  function makePole(x,y, fillHex){
    return new fabric.Rect({
      left: x-3, top: y-28, width: 6, height: 56,
      fill: fillHex,
      stroke:'#111',
      strokeWidth: 2
    });
  }

  function makeFlag(x,y, fillHex){
    const pole = new fabric.Rect({
      left: -3, top: -30, width: 6, height: 60,
      fill: fillHex,
      stroke:'#111',
      strokeWidth: 2
    });
    const flag = new fabric.Path(`M 3 -26 L 30 -18 L 3 -8 Z`, {
      fill: fillHex,
      stroke:'#111',
      strokeWidth: 2
    });
    return new fabric.Group([pole, flag], { left:x, top:y, originX:'center', originY:'center' });
  }

  // 2D goal; colour picker affects stroke/net colour
  function makeGoal(x,y, strokeHex){
    const w = 62, h = 40;
    const frame = new fabric.Rect({
      left: -w/2, top: -h/2,
      width: w, height: h,
      fill: 'transparent',
      stroke: strokeHex,
      strokeWidth: 3,
      rx: 2, ry: 2
    });

    const net = [];
    const cols = 6, rows = 4;
    for(let i=1;i<cols;i++){
      const xx = -w/2 + i*(w/cols);
      net.push(new fabric.Line([xx, -h/2, xx, h/2], { stroke: strokeHex, strokeWidth: 2 }));
    }
    for(let j=1;j<rows;j++){
      const yy = -h/2 + j*(h/rows);
      net.push(new fabric.Line([-w/2, yy, w/2, yy], { stroke: strokeHex, strokeWidth: 2 }));
    }

    const leg1 = new fabric.Line([-w/2, h/2, -w/2, h/2 + 10], { stroke: strokeHex, strokeWidth: 3 });
    const leg2 = new fabric.Line([ w/2, h/2,  w/2, h/2 + 10], { stroke: strokeHex, strokeWidth: 3 });

    return new fabric.Group([frame, ...net, leg1, leg2], {
      left:x, top:y,
      originX:'center', originY:'center'
    });
  }

  function makeText(x,y){
    return new fabric.IText('Text', {
      left: x, top: y,
      fill: '#ffffff',
      fontSize: 20,
      fontWeight: '700',
      editable: true
    });
  }

  // --- Mode ---
  const addModeBtn  = document.getElementById('addModeBtn');
  const editModeBtn = document.getElementById('editModeBtn');
  const addControls = document.getElementById('addControls');

  function refreshSelectability(){
    canvas.getObjects().forEach(o => {
      if (o.isPitch) return;
      o.selectable = (mode === 'edit');
      o.evented = (mode === 'edit');
    });
    canvas.requestRenderAll();
  }

  function setMode(newMode){
    mode = newMode;
    if (mode === 'edit'){
      canvas.selection = true;
      canvas.skipTargetFind = false;
      addModeBtn.classList.remove('active');
      editModeBtn.classList.add('active');
      addControls.style.opacity = '0.55';
    } else {
      canvas.discardActiveObject();
      canvas.selection = false;
      canvas.skipTargetFind = true;
      addModeBtn.classList.add('active');
      editModeBtn.classList.remove('active');
      addControls.style.opacity = '1';
    }
    refreshSelectability();
  }

  addModeBtn.addEventListener('click', () => { setMode('add'); setLineDrawing(false); });
  editModeBtn.addEventListener('click', () => { setMode('edit'); setLineDrawing(false); });

  // --- UI ---
  const addTypeEl = document.getElementById('addType');
  const lineTypeEl = document.getElementById('lineType');
  const colorEl = document.getElementById('strokeColor');
  const playerLabelEl = document.getElementById('playerLabel');

  addTypeEl.addEventListener('change', (e) => {
    addType = e.target.value;

    // ✅ easier switching: picking an object auto-stops line tool
    if (lineType !== 'none') {
      lineType = 'none';
      lineTypeEl.value = 'none';
      setLineDrawing(false);
    }
  });

  lineTypeEl.addEventListener('change', (e) => {
    lineType = e.target.value;

    // ✅ easier switching: picking a line tool instantly works
    if (mode === 'add' && lineType === 'free') setLineDrawing(true);
    else setLineDrawing(false);
  });

  colorEl.addEventListener('input', (e) => {
    strokeColor = e.target.value;
    if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = strokeColor;
  });

  // --- Lines ---
  let isDrawingLine = false;
  let lineStart = null;
  let tempObj = null;

  function setLineDrawing(on){
    canvas.isDrawingMode = !!on;
    if (on){
      canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.width = 3;
      canvas.freeDrawingBrush.color = strokeColor;
    }
  }

  function makeArrowHead(x1,y1,x2,y2, color){
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const size = 10;
    return new fabric.Triangle({
      left: x2, top: y2,
      originX: 'center', originY: 'center',
      angle: angle * 180/Math.PI + 90,
      width: size*1.2, height: size*1.6,
      fill: color, stroke: '#111', strokeWidth: 1
    });
  }

  function beginLine(p){
    isDrawingLine = true;
    lineStart = p;
    if (lineType === 'curved'){
      tempObj = new fabric.Path(`M ${p.x} ${p.y} Q ${p.x} ${p.y} ${p.x} ${p.y}`, {
        fill: '', stroke: strokeColor, strokeWidth: 3, selectable:false, evented:false
      });
      canvas.add(tempObj);
    } else {
      tempObj = new fabric.Line([p.x, p.y, p.x, p.y], {
        stroke: strokeColor, strokeWidth: 3, selectable:false, evented:false,
        strokeDashArray: (lineType === 'dashed') ? [10,7] : null
      });
      canvas.add(tempObj);
    }
  }

  function updateLine(p){
    if (!tempObj) return;
    if (lineType === 'curved'){
      const cx = (lineStart.x + p.x)/2;
      const cy = (lineStart.y + p.y)/2 - 50;
      tempObj.set({ path: [['M', lineStart.x, lineStart.y], ['Q', cx, cy, p.x, p.y]] });
    } else {
      tempObj.set({ x2: p.x, y2: p.y });
    }
    canvas.requestRenderAll();
  }

  function finishLine(p){
    isDrawingLine = false;
    canvas.remove(tempObj);

    let finalObj = null;

    if (lineType === 'curved'){
      const cx = (lineStart.x + p.x)/2;
      const cy = (lineStart.y + p.y)/2 - 50;
      finalObj = new fabric.Path(`M ${lineStart.x} ${lineStart.y} Q ${cx} ${cy} ${p.x} ${p.y}`, {
        fill: '', stroke: strokeColor, strokeWidth: 3
      });
    } else {
      finalObj = new fabric.Line([lineStart.x, lineStart.y, p.x, p.y], {
        stroke: strokeColor, strokeWidth: 3,
        strokeDashArray: (lineType === 'dashed') ? [10,7] : null
      });
    }

    if (lineType === 'arrow'){
      const head = makeArrowHead(lineStart.x, lineStart.y, p.x, p.y, strokeColor);
      finalObj = new fabric.Group([finalObj, head], {});
    }

    normalizeNewObject(finalObj);
    canvas.add(finalObj);
    finalObj.selectable = (mode === 'edit');
    finalObj.evented    = (mode === 'edit');

    tempObj = null;
    lineStart = null;
    canvas.requestRenderAll();
  }

  // --- Canvas events ---
  canvas.on('mouse:down', (opt) => {
    if (mode !== 'add') return;

    const p = canvas.getPointer(opt.e);
    const chosen = strokeColor; // ✅ colour picker affects objects too

    if (lineType === 'free') return;

    if (lineType !== 'none'){
      pushHistory();
      beginLine(p);
      return;
    }

    pushHistory();
    const obj = (() => {
      switch(addType){
        case 'player': return makePlayer(p.x, p.y, chosen, playerLabelEl.value.trim());
        case 'ball': return makeFootball(p.x, p.y);
        case 'cone': return makeCone(p.x, p.y, chosen);
        case 'goal': return makeGoal(p.x, p.y, chosen);
        case 'mannequin': return makeMannequin(p.x, p.y, chosen);
        case 'pole': return makePole(p.x, p.y, chosen);
        case 'flag': return makeFlag(p.x, p.y, chosen);
        case 'text': return makeText(p.x, p.y);
        default: return makeCone(p.x, p.y, chosen);
      }
    })();

    normalizeNewObject(obj);
    obj.selectable = false;
    obj.evented = false;
    canvas.add(obj);
    canvas.requestRenderAll();
  });

  canvas.on('mouse:move', (opt) => {
    if (!isDrawingLine) return;
    const p = canvas.getPointer(opt.e);
    updateLine(p);
  });

  canvas.on('mouse:up', (opt) => {
    if (!isDrawingLine) return;
    const p = canvas.getPointer(opt.e);
    finishLine(p);
  });

  canvas.on('path:created', (opt) => {
    if (lineType !== 'free') return;
    pushHistory();
    const path = opt.path;
    normalizeNewObject(path);
    path.stroke = strokeColor;
    path.selectable = (mode === 'edit');
    path.evented = (mode === 'edit');
    canvas.requestRenderAll();
  });

  // ✅ Double-click a player in Edit to rename (simple + reliable)
  canvas.on('mouse:dblclick', (opt) => {
    const t = opt.target;
    if (!t || mode !== 'edit') return;

    // Edit normal IText
    if (t.type === 'i-text'){
      t.enterEditing();
      t.hiddenTextarea && t.hiddenTextarea.focus();
      return;
    }

    // Rename player group
    if (t.type === 'group' && t.isPlayer){
      const current = t.playerText || '';
      const next = prompt('Player name/number:', current);
      if (next === null) return;

      t.playerText = next;

      // find the text object inside group (second object)
      const txtObj = t._objects && t._objects[1];
      if (txtObj && (txtObj.type === 'text' || txtObj.type === 'i-text')){
        txtObj.text = next;
      }
      canvas.requestRenderAll();
      pushHistory();
    }
  });

  // --- Undo / Redo / Clear ---
  document.getElementById('undoBtn').addEventListener('click', () => {
    if (undoStack.length <= 1) return;
    const current = undoStack.pop();
    redoStack.push(current);
    const prev = undoStack[undoStack.length - 1];
    loadFrom(prev);
  });

  document.getElementById('redoBtn').addEventListener('click', () => {
    if (!redoStack.length) return;
    const next = redoStack.pop();
    undoStack.push(next);
    loadFrom(next);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    pushHistory();
    canvas.getObjects().slice().forEach(o => { if (!o.isPitch) canvas.remove(o); });
    canvas.discardActiveObject();
    canvas.requestRenderAll();
  });

  // --- Zoom + Pan ---
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');

  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

  function setZoomAtCenter(targetZoom){
    const z = clamp(targetZoom, 0.6, 3.2);
    const center = canvas.getCenter();
    canvas.zoomToPoint(new fabric.Point(center.left, center.top), z);
    canvas.requestRenderAll();
  }

  zoomInBtn.addEventListener('click', () => setZoomAtCenter(canvas.getZoom() * 1.15));
  zoomOutBtn.addEventListener('click', () => setZoomAtCenter(canvas.getZoom() / 1.15));
  zoomResetBtn.addEventListener('click', () => {
    canvas.setViewportTransform([1,0,0,1,0,0]);
    canvas.requestRenderAll();
  });

  canvas.on('mouse:wheel', (opt) => {
    const e = opt.e;
    const delta = e.deltaY;
    let zoom = canvas.getZoom();
    zoom *= Math.pow(0.999, delta);
    zoom = clamp(zoom, 0.6, 3.2);
    const pt = new fabric.Point(e.offsetX, e.offsetY);
    canvas.zoomToPoint(pt, zoom);
    e.preventDefault();
    e.stopPropagation();
  });

  // Touch pinch + two-finger pan
  let lastTouch = null;
  let lastDist = null;

  frameEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2){
      lastTouch = {
        x: (e.touches[0].clientX + e.touches[1].clientX)/2,
        y: (e.touches[0].clientY + e.touches[1].clientY)/2
      };
      lastDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive:false });

  frameEl.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();

    const mid = {
      x: (e.touches[0].clientX + e.touches[1].clientX)/2,
      y: (e.touches[0].clientY + e.touches[1].clientY)/2
    };
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );

    if (lastDist){
      let zoom = canvas.getZoom() * (dist / lastDist);
      zoom = clamp(zoom, 0.6, 3.2);
      const rect = frameEl.getBoundingClientRect();
      const pt = new fabric.Point(mid.x - rect.left, mid.y - rect.top);
      canvas.zoomToPoint(pt, zoom);
    }

    if (lastTouch){
      const dx = mid.x - lastTouch.x;
      const dy = mid.y - lastTouch.y;
      const vpt = canvas.viewportTransform;
      vpt[4] += dx;
      vpt[5] += dy;
      canvas.requestRenderAll();
    }

    lastTouch = mid;
    lastDist = dist;
  }, { passive:false });

  frameEl.addEventListener('touchend', () => {
    lastTouch = null;
    lastDist = null;
  });

  // --- Export (branding black) ---
  function withBrandingTemp(fn){
    const W = canvas.getWidth();
    const H = canvas.getHeight();

    const brand = new fabric.Text('TactiGrid', {
      left: W - 14,
      top: H - 14,
      originX: 'right',
      originY: 'bottom',
      fill: '#000000',
      fontSize: 18,
      fontWeight: '800',
      selectable:false,
      evented:false
    });

    canvas.add(brand);
    canvas.bringToFront(brand);
    canvas.requestRenderAll();

    try { return fn(); }
    finally {
      canvas.remove(brand);
      canvas.requestRenderAll();
    }
  }

  document.getElementById('exportPngBtn').addEventListener('click', () => {
    withBrandingTemp(() => {
      const dataUrl = canvas.toDataURL({ format:'png', multiplier: 2, enableRetinaScaling: true });
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'tactigrid-drill.png';
      a.click();
    });
  });

  document.getElementById('exportPdfBtn').addEventListener('click', () => {
    const notesText = document.getElementById('notes').value || '';

    withBrandingTemp(() => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });

      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();

      const img = canvas.toDataURL({ format:'png', multiplier: 2, enableRetinaScaling: true });

      const margin = 36;
      const maxW = pageW - margin*2;
      const maxH = pageH * 0.58;

      const imgW = canvas.getWidth();
      const imgH = canvas.getHeight();
      const scale = Math.min(maxW / imgW, maxH / imgH);

      const drawW = imgW * scale;
      const drawH = imgH * scale;

      const x = (pageW - drawW) / 2;
      const y = margin;

      pdf.addImage(img, 'PNG', x, y, drawW, drawH);

      pdf.setTextColor(0,0,0);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(14);
      pdf.text('TactiGrid Drill Designer', margin, y + drawH + 28);

      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(11);
      const wrapped = pdf.splitTextToSize(notesText || '—', pageW - margin*2);
      pdf.text(wrapped, margin, y + drawH + 52);

      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(10);
      pdf.text('TactiGrid', pageW - margin, pageH - 18, { align:'right' });

      pdf.save('tactigrid-drill.pdf');
    });
  });

  // --- Init + resize ---
  function init(){
    fitCanvasToFrame();
    makeFullPitch();
    resetHistory();
    setMode('add');

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => rebuildPitchPreserveObjects(), 120);
    });
  }

  init();
})();
</script>
</body>
</html>
