<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TactiGrid Drill Designer</title>

  <!-- Fabric.js for object editing (drag/resize/rotate) + touch support -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <!-- jsPDF for PDF export -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <style>
    :root{
      --bg:#0b0b0f;
      --panel:#11121a;
      --panel2:#0f1017;
      --text:#f3f3f3;
      --muted:#b8b8b8;
      --yellow:#ffd400;
      --border:rgba(255,255,255,0.10);
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 14px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(255,212,0,0.10), transparent 55%),
                  radial-gradient(1000px 600px at 100% 0%, rgba(255,212,0,0.06), transparent 55%),
                  var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    header{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 14px;
    }

    .brand{
      display:flex; align-items:center; gap:10px;
      user-select:none;
    }
    .logoMark{
      width:34px; height:34px; border-radius: 10px;
      background: linear-gradient(135deg, rgba(255,212,0,0.95), rgba(255,212,0,0.65));
      box-shadow: 0 10px 25px rgba(255,212,0,0.18);
      position:relative;
    }
    .logoMark:after{
      content:"";
      position:absolute; inset:8px;
      border-radius: 8px;
      border:2px solid rgba(0,0,0,0.55);
    }
    .brand h1{
      font-size: 18px;
      margin:0;
      letter-spacing: 0.2px;
      font-weight: 800;
    }
    .brand .sub{
      margin:0;
      font-size: 12px;
      color: var(--muted);
      margin-top:2px;
    }

    .topControls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent 70%),
                  var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .toolbar{
      display:flex;
      gap:10px;
      padding: 12px;
      align-items:center;
      flex-wrap:wrap;
    }

    .group{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding: 6px 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
    }

    label{
      font-size: 12px;
      color: var(--muted);
      margin-right: 4px;
      white-space:nowrap;
    }

    select, input[type="color"], textarea{
      background: var(--panel2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      padding: 10px 10px;
      outline:none;
      font-size: 14px;
    }

    input[type="color"]{
      padding: 0;
      width: 44px;
      height: 38px;
      border-radius: 10px;
    }

    .btn{
      appearance:none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 700;
      display:inline-flex;
      gap:10px;
      align-items:center;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
      user-select:none;
    }
    .btn:hover{
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.18);
    }
    .btn:active{ transform: translateY(1px); }

    .btn.primary{
      background: rgba(255,212,0,0.14);
      border-color: rgba(255,212,0,0.35);
    }
    .btn.primary:hover{
      background: rgba(255,212,0,0.18);
      border-color: rgba(255,212,0,0.55);
    }

    .btn.icon{
      padding: 10px 12px;
      min-width: 44px;
      justify-content:center;
    }

    .btn.active{
      outline: 2px solid rgba(255,212,0,0.55);
      outline-offset: 1px;
    }

    .ico{
      width: 18px; height: 18px; display:inline-block;
    }

    .layout{
      display:grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .canvasPanel{
      padding: 12px;
    }

    .canvasFrame{
      width:100%;
      border-radius: 14px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0a0a0d;
      touch-action: none; /* allow custom pinch/drag */
    }

    canvas{ display:block; }

    .notesPanel{
      padding: 12px;
    }
    .notesPanel h2{
      margin: 0 0 8px 0;
      font-size: 14px;
      letter-spacing:0.2px;
    }
    textarea{
      width:100%;
      min-height: 120px;
      resize: vertical;
      line-height: 1.35;
    }

    .exportRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 10px;
    }

    .hint{
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.35;
    }

    @media (min-width: 860px){
      .layout{
        grid-template-columns: 1fr 380px;
        align-items:start;
      }
      .notesPanel{
        position: sticky;
        top: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logoMark" aria-hidden="true"></div>
        <div>
          <h1>TactiGrid Drill Designer</h1>
          <p class="sub">Design drills, add notes, export PNG/PDF</p>
        </div>
      </div>

      <div class="topControls">
        <button class="btn icon" id="zoomOutBtn" title="Zoom out">
          <span class="ico">➖</span>
        </button>
        <button class="btn icon" id="zoomResetBtn" title="Reset view">
          <span class="ico">⤾</span>
        </button>
        <button class="btn icon" id="zoomInBtn" title="Zoom in">
          <span class="ico">➕</span>
        </button>
      </div>
    </header>

    <div class="panel toolbar" role="region" aria-label="Toolbar">
      <div class="group">
        <label for="pitchType">Pitch</label>
        <select id="pitchType">
          <option value="full" selected>Full Pitch</option>
          <option value="half">Half Pitch (vertical)</option>
          <option value="blank">Blank</option>
        </select>
      </div>

      <div class="group">
        <button class="btn primary active" id="addModeBtn" title="Add objects/lines">
          <span class="ico" aria-hidden="true">➕</span>
          Add
        </button>
        <button class="btn" id="editModeBtn" title="Edit (select/move/resize/rotate)">
          <span class="ico" aria-hidden="true">✏️</span>
          Edit
        </button>
      </div>

      <div class="group" id="addControls">
        <label for="addType">Add</label>
        <select id="addType">
          <option value="player">Player</option>
          <option value="ball">Ball</option>
          <option value="cone">Cone</option>
          <option value="goal">Goal</option>
          <option value="mannequin">Mannequin</option>
          <option value="pole">Pole</option>
          <option value="flag">Flag</option>
          <option value="text">Text</option>
        </select>

        <label for="lineType">Line</label>
        <select id="lineType">
          <option value="none" selected>—</option>
          <option value="straight">Straight</option>
          <option value="arrow">Arrow</option>
          <option value="dashed">Dashed</option>
          <option value="curved">Curved</option>
          <option value="free">Free Draw</option>
        </select>

        <label for="strokeColor">Colour</label>
        <input type="color" id="strokeColor" value="#ffd400" />
      </div>

      <div class="group">
        <button class="btn" id="undoBtn" title="Undo">Undo</button>
        <button class="btn" id="redoBtn" title="Redo">Redo</button>
        <button class="btn" id="clearBtn" title="Clear all">Clear</button>
      </div>
    </div>

    <div class="layout">
      <div class="panel canvasPanel">
        <div class="canvasFrame" id="canvasFrame">
          <canvas id="c"></canvas>
        </div>
        <div class="hint">
          Tips: Use <b>Edit</b> to move/resize/rotate. Pinch to zoom on mobile. Two-finger drag to pan.
        </div>
      </div>

      <div class="panel notesPanel">
        <h2>Notes</h2>
        <textarea id="notes" placeholder="Write session notes here... (included in PDF export)"></textarea>

        <div class="exportRow">
          <button class="btn primary" id="exportPngBtn" title="Export PNG">
            <span class="ico" aria-hidden="true">🖼️</span>
            Export PNG
          </button>
          <button class="btn primary" id="exportPdfBtn" title="Export PDF">
            <span class="ico" aria-hidden="true">📄</span>
            Export PDF
          </button>
        </div>

        <div class="hint">
          Export branding is included in <b>black</b> on the output.
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ----------------------------
  // Canvas / sizing
  // ----------------------------
  const canvasEl = document.getElementById('c');
  const frameEl  = document.getElementById('canvasFrame');

  const canvas = new fabric.Canvas('c', {
    backgroundColor: '#0a0a0d',
    selection: false,
    preserveObjectStacking: true,
    stopContextMenu: true
  });

  // Keep a pitch layer group (not selectable) so it always stays behind.
  let pitchGroup = null;

  // State
  let mode = 'add'; // 'add' | 'edit'
  let addType = 'player';
  let lineType = 'none';
  let strokeColor = document.getElementById('strokeColor').value;

  // Undo/redo (simple JSON snapshots)
  let undoStack = [];
  let redoStack = [];
  const MAX_STACK = 40;

  function pushHistory() {
    redoStack.length = 0;
    const json = canvas.toJSON(['idTag', 'isPitch']);
    undoStack.push(json);
    if (undoStack.length > MAX_STACK) undoStack.shift();
  }

  function loadFrom(json) {
    canvas.loadFromJSON(json, () => {
      // Ensure pitch objects remain non-selectable
      canvas.getObjects().forEach(o => {
        if (o.isPitch) {
          o.selectable = false;
          o.evented = false;
          o.excludeFromExport = false;
        }
      });
      canvas.requestRenderAll();
    });
  }

  // Initial history state
  function resetHistory() {
    undoStack = [];
    redoStack = [];
    pushHistory();
  }

  // ----------------------------
  // Responsive sizing + pitch types
  // ----------------------------
  const pitchTypeSel = document.getElementById('pitchType');

  function fitCanvasToFrame() {
    const r = frameEl.getBoundingClientRect();
    const w = Math.max(320, Math.floor(r.width));

    const type = pitchTypeSel.value;
    // Full pitch: wide
    // Half pitch: vertical AND canvas itself is half pitch (taller feel but only half length)
    // Blank: same as full
    let h;
    if (type === 'half') {
      // vertical half pitch: make canvas taller relative to width
      h = Math.floor(w * 1.25);
    } else {
      h = Math.floor(w * 0.58); // similar to a full pitch aspect
    }

    canvas.setWidth(w);
    canvas.setHeight(h);
    canvas.calcOffset();
    canvas.requestRenderAll();
  }

  function clearPitchOnly() {
    if (!pitchGroup) return;
    canvas.remove(pitchGroup);
    pitchGroup = null;
  }

  function makePitch(type) {
    clearPitchOnly();

    if (type === 'blank') {
      canvas.setBackgroundColor('#0a0a0d', canvas.requestRenderAll.bind(canvas));
      return;
    }

    // Pitch drawing parameters
    const W = canvas.getWidth();
    const H = canvas.getHeight();
    const margin = Math.max(18, Math.floor(Math.min(W,H) * 0.04));

    // pitch colors
    const pitchFill = '#1d6a3a';
    const pitchStripe = '#1a6135';
    const lineColor = '#f7f7f7';

    // Base field rect
    const field = new fabric.Rect({
      left: margin,
      top: margin,
      width: W - margin*2,
      height: H - margin*2,
      fill: pitchFill,
      rx: 6, ry: 6,
      selectable: false,
      evented: false
    });

    // Stripes
    const stripes = [];
    const stripeCount = 10;
    const stripeW = (field.width) / stripeCount;
    for (let i=0;i<stripeCount;i++){
      stripes.push(new fabric.Rect({
        left: field.left + i*stripeW,
        top: field.top,
        width: stripeW,
        height: field.height,
        fill: i%2===0 ? pitchFill : pitchStripe,
        selectable:false,
        evented:false
      }));
    }

    // Helper to create white lines
    const L = (...args) => new fabric.Line(args, {
      stroke: lineColor,
      strokeWidth: 2,
      selectable:false,
      evented:false
    });

    const R = (opts) => new fabric.Rect({
      fill: 'transparent',
      stroke: lineColor,
      strokeWidth: 2,
      selectable:false,
      evented:false,
      ...opts
    });

    const C = (opts) => new fabric.Circle({
      fill: 'transparent',
      stroke: lineColor,
      strokeWidth: 2,
      selectable:false,
      evented:false,
      ...opts
    });

    const objects = [...stripes, field];

    // Outer boundary
    objects.push(R({
      left: field.left,
      top: field.top,
      width: field.width,
      height: field.height
    }));

    if (type === 'full') {
      // Halfway line
      objects.push(L(field.left, field.top + field.height/2, field.left + field.width, field.top + field.height/2));

      // Centre circle + spot
      const ccR = Math.min(field.width, field.height) * 0.12;
      objects.push(C({ left: field.left + field.width/2 - ccR, top: field.top + field.height/2 - ccR, radius: ccR }));
      objects.push(new fabric.Circle({
        left: field.left + field.width/2 - 2,
        top: field.top + field.height/2 - 2,
        radius: 2,
        fill: lineColor,
        stroke: lineColor,
        selectable:false, evented:false
      }));

      // Penalty areas / goals at BOTH ends (this fixes “missing boxes on half the pitch” in full pitch)
      const boxW = field.width * 0.55;
      const boxH = field.height * 0.18;
      const sixW = field.width * 0.30;
      const sixH = field.height * 0.07;
      const goalW = field.width * 0.18;
      const goalH = field.height * 0.02;

      // Top end
      objects.push(R({
        left: field.left + (field.width - boxW)/2,
        top: field.top,
        width: boxW,
        height: boxH
      }));
      objects.push(R({
        left: field.left + (field.width - sixW)/2,
        top: field.top,
        width: sixW,
        height: sixH
      }));
      // Goal (simple)
      objects.push(R({
        left: field.left + (field.width - goalW)/2,
        top: field.top - goalH,
        width: goalW,
        height: goalH
      }));
      // Penalty spot
      objects.push(new fabric.Circle({
        left: field.left + field.width/2 - 2,
        top: field.top + boxH*0.62 - 2,
        radius: 2,
        fill: lineColor,
        stroke: lineColor,
        selectable:false, evented:false
      }));

      // Bottom end
      objects.push(R({
        left: field.left + (field.width - boxW)/2,
        top: field.top + field.height - boxH,
        width: boxW,
        height: boxH
      }));
      objects.push(R({
        left: field.left + (field.width - sixW)/2,
        top: field.top + field.height - sixH,
        width: sixW,
        height: sixH
      }));
      objects.push(R({
        left: field.left + (field.width - goalW)/2,
        top: field.top + field.height,
        width: goalW,
        height: goalH
      }));
      objects.push(new fabric.Circle({
        left: field.left + field.width/2 - 2,
        top: field.top + field.height - boxH*0.62 - 2,
        radius: 2,
        fill: lineColor,
        stroke: lineColor,
        selectable:false, evented:false
      }));
    }

    if (type === 'half') {
      // TRUE HALF PITCH (vertical): from halfway line down to one goal.
      // Canvas is already taller, and we draw: halfway line at bottom, goal at top.
      // No random corner arcs.

      // Halfway line across the bottom edge of field
      objects.push(L(field.left, field.top + field.height, field.left + field.width, field.top + field.height));

      // Centre circle is off-canvas in half pitch; show just the centre arc at the bottom edge (simple, no corner weirdness)
      const ccR = Math.min(field.width, field.height) * 0.20;
      const arcPath = describeArc(field.left + field.width/2, field.top + field.height, ccR, 180, 0);
      objects.push(new fabric.Path(arcPath, {
        fill: '',
        stroke: lineColor,
        strokeWidth: 2,
        selectable:false,
        evented:false
      }));

      // Penalty area at TOP end
      const boxW = field.width * 0.62;
      const boxH = field.height * 0.26;
      const sixW = field.width * 0.34;
      const sixH = field.height * 0.10;
      const goalW = field.width * 0.22;
      const goalH = field.height * 0.03;

      objects.push(R({
        left: field.left + (field.width - boxW)/2,
        top: field.top,
        width: boxW,
        height: boxH
      }));
      objects.push(R({
        left: field.left + (field.width - sixW)/2,
        top: field.top,
        width: sixW,
        height: sixH
      }));
      objects.push(R({
        left: field.left + (field.width - goalW)/2,
        top: field.top - goalH,
        width: goalW,
        height: goalH
      }));
      // Penalty spot
      objects.push(new fabric.Circle({
        left: field.left + field.width/2 - 2,
        top: field.top + boxH*0.62 - 2,
        radius: 2,
        fill: lineColor,
        stroke: lineColor,
        selectable:false, evented:false
      }));
    }

    // Mark pitch objects
    pitchGroup = new fabric.Group(objects, {
      selectable:false,
      evented:false
    });
    pitchGroup.isPitch = true;
    pitchGroup.excludeFromExport = false;

    canvas.add(pitchGroup);
    canvas.sendToBack(pitchGroup);
    canvas.requestRenderAll();
  }

  // Arc helper (SVG path)
  function polarToCartesian(cx, cy, r, angleDeg) {
    const rad = (angleDeg - 90) * Math.PI / 180.0;
    return { x: cx + (r * Math.cos(rad)), y: cy + (r * Math.sin(rad)) };
  }
  function describeArc(cx, cy, r, startAngle, endAngle){
    const start = polarToCartesian(cx, cy, r, endAngle);
    const end   = polarToCartesian(cx, cy, r, startAngle);
    const largeArcFlag = (endAngle - startAngle) <= 180 ? "0" : "1";
    return [
      "M", start.x, start.y,
      "A", r, r, 0, largeArcFlag, 0, end.x, end.y
    ].join(" ");
  }

  // Rebuild pitch on resize/type change without touching drawn objects
  function rebuildPitchPreserveObjects() {
    // Grab non-pitch objects
    const keep = canvas.getObjects().filter(o => !o.isPitch);
    clearPitchOnly();
    fitCanvasToFrame();
    makePitch(pitchTypeSel.value);
    // Re-add keep objects on top
    keep.forEach(o => canvas.add(o));
    canvas.requestRenderAll();
  }

  // ----------------------------
  // Simple “v1 style” icons (ONLY mannequin + goal updated as requested)
  // ----------------------------
  function makePlayer(x,y){
    return new fabric.Circle({
      left: x-16, top: y-16, radius: 16,
      fill: '#ffd400',
      stroke: '#111',
      strokeWidth: 2
    });
  }

  function makeFootball(x,y){
    // football-like: white circle + black patches
    const base = new fabric.Circle({
      left: x-14, top: y-14, radius: 14,
      fill: '#f6f6f6',
      stroke: '#111',
      strokeWidth: 2
    });
    const patch = new fabric.RegularPolygon({
      left: x-6, top: y-6,
      radius: 6, sides: 5,
      fill: '#111'
    });
    const p2 = new fabric.Circle({ left:x-12, top:y-2, radius:3, fill:'#111' });
    const p3 = new fabric.Circle({ left:x+6, top:y-2, radius:3, fill:'#111' });
    const p4 = new fabric.Circle({ left:x-3, top:y+7, radius:3, fill:'#111' });
    return new fabric.Group([base, patch, p2, p3, p4], { left:x, top:y, originX:'center', originY:'center' });
  }

  function makeCone(x,y){
    const tri = new fabric.Triangle({
      left: x-14, top: y-16, width: 28, height: 32,
      fill: '#ff9f1a',
      stroke: '#111',
      strokeWidth: 2
    });
    return tri;
  }

  // ✅ Mannequin: revert to simple v1-style (head + torso silhouette)
  function makeMannequin(x,y){
    const head = new fabric.Circle({
      left: x-7, top: y-26, radius: 7,
      fill: '#e6e6e6',
      stroke: '#111',
      strokeWidth: 2
    });
    const body = new fabric.Rect({
      left: x-10, top: y-18,
      width: 20, height: 48,
      rx: 8, ry: 8,
      fill: '#e6e6e6',
      stroke: '#111',
      strokeWidth: 2
    });
    return new fabric.Group([body, head], { left:x, top:y, originX:'center', originY:'center' });
  }

  // Pole + Flag (kept as-is from current “perfect” version style)
  function makePole(x,y){
    const pole = new fabric.Rect({
      left: x-3, top: y-28, width: 6, height: 56,
      fill: '#d0d0d0',
      stroke:'#111',
      strokeWidth: 2
    });
    return pole;
  }

  function makeFlag(x,y){
    const pole = new fabric.Rect({
      left: x-3, top: y-30, width: 6, height: 60,
      fill: '#d0d0d0',
      stroke:'#111',
      strokeWidth: 2
    });
    const flag = new fabric.Path(`M ${x+3} ${y-26} L ${x+30} ${y-18} L ${x+3} ${y-8} Z`, {
      fill: '#ff3b30',
      stroke:'#111',
      strokeWidth: 2
    });
    return new fabric.Group([pole, flag], { left:x, top:y, originX:'center', originY:'center' });
  }

  // ✅ Goal: revert to simple v1-style (clean goal frame)
  function makeGoal(x,y){
    const w = 46, h = 26;
    const frame = new fabric.Rect({
      left: x - w/2, top: y - h/2,
      width: w, height: h,
      fill: 'transparent',
      stroke: '#f6f6f6',
      strokeWidth: 3
    });
    const net = new fabric.Line([x - w/2, y, x + w/2, y], {
      stroke: '#f6f6f6',
      strokeWidth: 2,
      strokeDashArray: [4,4]
    });
    return new fabric.Group([frame, net], { left:x, top:y, originX:'center', originY:'center' });
  }

  function makeText(x,y){
    const t = new fabric.IText('Text', {
      left: x, top: y,
      fill: '#ffffff',
      fontSize: 20,
      fontWeight: '700',
      stroke: '#111',
      strokeWidth: 0,
      editable: true
    });
    // Make editing easy: single tap to enter editing in edit mode
    return t;
  }

  // Ensure new objects are editable
  function normalizeNewObject(o){
    o.set({
      cornerColor: '#ffd400',
      cornerStrokeColor: '#111',
      borderColor: 'rgba(255,212,0,0.8)',
      cornerSize: 10,
      transparentCorners: false,
      padding: 2
    });
    return o;
  }

  // ----------------------------
  // Add / edit modes
  // ----------------------------
  const addModeBtn  = document.getElementById('addModeBtn');
  const editModeBtn = document.getElementById('editModeBtn');
  const addControls = document.getElementById('addControls');

  function setMode(newMode){
    mode = newMode;
    if (mode === 'edit'){
      canvas.selection = true;
      canvas.skipTargetFind = false;
      addModeBtn.classList.remove('active');
      editModeBtn.classList.add('active');
      addControls.style.opacity = '0.55';
    } else {
      canvas.discardActiveObject();
      canvas.selection = false;
      canvas.skipTargetFind = true;
      addModeBtn.classList.add('active');
      editModeBtn.classList.remove('active');
      addControls.style.opacity = '1';
    }
    canvas.requestRenderAll();
  }

  addModeBtn.addEventListener('click', () => {
    setMode('add');
    setLineDrawing(false);
  });

  editModeBtn.addEventListener('click', () => {
    setMode('edit');
    setLineDrawing(false);
  });

  // ----------------------------
  // Dropdowns / color
  // ----------------------------
  document.getElementById('addType').addEventListener('change', (e) => addType = e.target.value);
  document.getElementById('lineType').addEventListener('change', (e) => {
    lineType = e.target.value;
    if (mode === 'add' && lineType === 'free') setLineDrawing(true);
    else setLineDrawing(false);
  });
  document.getElementById('strokeColor').addEventListener('input', (e) => {
    strokeColor = e.target.value;
    if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = strokeColor;
  });

  // ----------------------------
  // Line drawing tools (straight/arrow/dashed/curved/free)
  // ----------------------------
  let isDrawingLine = false;
  let lineStart = null;
  let tempObj = null;

  function setLineDrawing(on){
    canvas.isDrawingMode = !!on;
    if (on){
      canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.width = 3;
      canvas.freeDrawingBrush.color = strokeColor;
    }
  }

  function makeArrowHead(x1,y1,x2,y2, color){
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const size = 10;
    return new fabric.Triangle({
      left: x2,
      top: y2,
      originX: 'center',
      originY: 'center',
      angle: angle * 180/Math.PI + 90,
      width: size*1.2,
      height: size*1.6,
      fill: color,
      stroke: '#111',
      strokeWidth: 1
    });
  }

  function beginLine(p){
    isDrawingLine = true;
    lineStart = p;
    if (lineType === 'curved'){
      tempObj = new fabric.Path(`M ${p.x} ${p.y} Q ${p.x} ${p.y} ${p.x} ${p.y}`, {
        fill: '',
        stroke: strokeColor,
        strokeWidth: 3,
        selectable:false,
        evented:false
      });
      canvas.add(tempObj);
    } else {
      tempObj = new fabric.Line([p.x, p.y, p.x, p.y], {
        stroke: strokeColor,
        strokeWidth: 3,
        selectable:false,
        evented:false,
        strokeDashArray: (lineType === 'dashed') ? [10,7] : null
      });
      canvas.add(tempObj);
    }
  }

  function updateLine(p){
    if (!tempObj) return;
    if (lineType === 'curved'){
      // Control point in the middle, lifted a bit for a gentle curve
      const cx = (lineStart.x + p.x)/2;
      const cy = (lineStart.y + p.y)/2 - 50;
      tempObj.set({ path: [['M', lineStart.x, lineStart.y], ['Q', cx, cy, p.x, p.y]] });
    } else {
      tempObj.set({ x2: p.x, y2: p.y });
    }
    canvas.requestRenderAll();
  }

  function finishLine(p){
    isDrawingLine = false;

    // Remove temp and replace with final (selectable = true in edit mode only)
    canvas.remove(tempObj);

    let finalObj = null;

    if (lineType === 'curved'){
      const cx = (lineStart.x + p.x)/2;
      const cy = (lineStart.y + p.y)/2 - 50;
      finalObj = new fabric.Path(`M ${lineStart.x} ${lineStart.y} Q ${cx} ${cy} ${p.x} ${p.y}`, {
        fill: '',
        stroke: strokeColor,
        strokeWidth: 3
      });
    } else {
      finalObj = new fabric.Line([lineStart.x, lineStart.y, p.x, p.y], {
        stroke: strokeColor,
        strokeWidth: 3,
        strokeDashArray: (lineType === 'dashed') ? [10,7] : null
      });
    }

    if (lineType === 'arrow'){
      const head = makeArrowHead(lineStart.x, lineStart.y, p.x, p.y, strokeColor);
      finalObj = new fabric.Group([finalObj, head], {});
    }

    normalizeNewObject(finalObj);
    canvas.add(finalObj);

    // Respect mode: selectable only in edit
    finalObj.selectable = (mode === 'edit');
    finalObj.evented    = (mode === 'edit');

    tempObj = null;
    lineStart = null;
    canvas.requestRenderAll();
  }

  // Fabric events
  canvas.on('mouse:down', (opt) => {
    if (mode !== 'add') return;

    const p = canvas.getPointer(opt.e);

    // If free draw, Fabric handles it
    if (lineType === 'free') return;

    // If a line type selected (not none), draw line
    if (lineType !== 'none'){
      pushHistory();
      beginLine(p);
      return;
    }

    // Otherwise add an object
    pushHistory();
    const obj = (() => {
      switch(addType){
        case 'player': return makePlayer(p.x, p.y);
        case 'ball': return makeFootball(p.x, p.y);
        case 'cone': return makeCone(p.x, p.y);
        case 'goal': return makeGoal(p.x, p.y);
        case 'mannequin': return makeMannequin(p.x, p.y);
        case 'pole': return makePole(p.x, p.y);
        case 'flag': return makeFlag(p.x, p.y);
        case 'text': return makeText(p.x, p.y);
        default: return makePlayer(p.x, p.y);
      }
    })();

    normalizeNewObject(obj);
    obj.selectable = false;
    obj.evented = false;
    canvas.add(obj);
    canvas.requestRenderAll();
  });

  canvas.on('mouse:move', (opt) => {
    if (!isDrawingLine) return;
    const p = canvas.getPointer(opt.e);
    updateLine(p);
  });

  canvas.on('mouse:up', (opt) => {
    if (!isDrawingLine) return;
    const p = canvas.getPointer(opt.e);
    finishLine(p);
  });

  // After free draw path created, make it exportable & editable in edit mode
  canvas.on('path:created', (opt) => {
    if (lineType !== 'free') return;
    pushHistory();
    const path = opt.path;
    normalizeNewObject(path);
    path.stroke = strokeColor;
    path.selectable = (mode === 'edit');
    path.evented = (mode === 'edit');
    canvas.requestRenderAll();
  });

  // Make selectability follow mode (so you can always go back to adding)
  function refreshSelectability(){
    canvas.getObjects().forEach(o => {
      if (o.isPitch) return;
      o.selectable = (mode === 'edit');
      o.evented = (mode === 'edit');
    });
    canvas.requestRenderAll();
  }

  // Easy text editing: in edit mode, double click/tap text to edit
  canvas.on('mouse:dblclick', (opt) => {
    const t = opt.target;
    if (!t) return;
    if (mode !== 'edit') return;

    // If group contains text, ignore; only IText
    if (t.type === 'i-text'){
      t.enterEditing();
      t.hiddenTextarea && t.hiddenTextarea.focus();
    }
  });

  // ----------------------------
  // Undo / Redo / Clear
  // ----------------------------
  document.getElementById('undoBtn').addEventListener('click', () => {
    if (undoStack.length <= 1) return;
    const current = undoStack.pop();
    redoStack.push(current);
    const prev = undoStack[undoStack.length - 1];
    loadFrom(prev);
  });

  document.getElementById('redoBtn').addEventListener('click', () => {
    if (!redoStack.length) return;
    const next = redoStack.pop();
    undoStack.push(next);
    loadFrom(next);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    pushHistory();
    canvas.getObjects().slice().forEach(o => {
      if (!o.isPitch) canvas.remove(o);
    });
    canvas.discardActiveObject();
    canvas.requestRenderAll();
  });

  // ----------------------------
  // Pitch type changes
  // ----------------------------
  pitchTypeSel.addEventListener('change', () => {
    // IMPORTANT: half pitch changes the canvas size too (as requested).
    // Preserve objects and pitch rebuild.
    rebuildPitchPreserveObjects();
    // keep current mode behavior
    refreshSelectability();
    pushHistory();
  });

  // ----------------------------
  // Zoom + Pan (mouse + touch)
  // ----------------------------
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');

  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

  function setZoomAtCenter(targetZoom){
    const z = clamp(targetZoom, 0.6, 3.2);
    const center = canvas.getCenter();
    canvas.zoomToPoint(new fabric.Point(center.left, center.top), z);
    canvas.requestRenderAll();
  }

  zoomInBtn.addEventListener('click', () => setZoomAtCenter(canvas.getZoom() * 1.15));
  zoomOutBtn.addEventListener('click', () => setZoomAtCenter(canvas.getZoom() / 1.15));
  zoomResetBtn.addEventListener('click', () => {
    canvas.setViewportTransform([1,0,0,1,0,0]);
    canvas.requestRenderAll();
  });

  // Mouse wheel zoom
  canvas.on('mouse:wheel', (opt) => {
    const e = opt.e;
    const delta = e.deltaY;
    let zoom = canvas.getZoom();
    zoom *= Math.pow(0.999, delta);
    zoom = clamp(zoom, 0.6, 3.2);
    const pt = new fabric.Point(e.offsetX, e.offsetY);
    canvas.zoomToPoint(pt, zoom);
    e.preventDefault();
    e.stopPropagation();
  });

  // Touch pinch + two-finger pan
  let lastTouch = null;
  let lastDist = null;

  frameEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2){
      lastTouch = {
        x: (e.touches[0].clientX + e.touches[1].clientX)/2,
        y: (e.touches[0].clientY + e.touches[1].clientY)/2
      };
      lastDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive:false });

  frameEl.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;

    e.preventDefault();

    const mid = {
      x: (e.touches[0].clientX + e.touches[1].clientX)/2,
      y: (e.touches[0].clientY + e.touches[1].clientY)/2
    };
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );

    // Zoom
    if (lastDist){
      let zoom = canvas.getZoom() * (dist / lastDist);
      zoom = clamp(zoom, 0.6, 3.2);

      const rect = frameEl.getBoundingClientRect();
      const pt = new fabric.Point(mid.x - rect.left, mid.y - rect.top);
      canvas.zoomToPoint(pt, zoom);
    }

    // Pan
    if (lastTouch){
      const dx = mid.x - lastTouch.x;
      const dy = mid.y - lastTouch.y;
      const vpt = canvas.viewportTransform;
      vpt[4] += dx;
      vpt[5] += dy;
      canvas.requestRenderAll();
    }

    lastTouch = mid;
    lastDist = dist;
  }, { passive:false });

  frameEl.addEventListener('touchend', () => {
    lastTouch = null;
    lastDist = null;
  });

  // ----------------------------
  // Export PNG / PDF (branding in BLACK)
  // ----------------------------
  function withBrandingTemp(fn){
    const W = canvas.getWidth();
    const H = canvas.getHeight();

    // Add black branding text temporarily (export only)
    const brand = new fabric.Text('TactiGrid', {
      left: W - 14,
      top: H - 14,
      originX: 'right',
      originY: 'bottom',
      fill: '#000000',
      fontSize: 18,
      fontWeight: '800',
      selectable:false,
      evented:false
    });

    canvas.add(brand);
    canvas.bringToFront(brand);
    canvas.requestRenderAll();

    try { return fn(); }
    finally {
      canvas.remove(brand);
      canvas.requestRenderAll();
    }
  }

  document.getElementById('exportPngBtn').addEventListener('click', () => {
    withBrandingTemp(() => {
      // multiplier improves clarity and preserves colours
      const dataUrl = canvas.toDataURL({ format:'png', multiplier: 2, enableRetinaScaling: true });
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = 'tactigrid-drill.png';
      a.click();
    });
  });

  document.getElementById('exportPdfBtn').addEventListener('click', async () => {
    const notesText = document.getElementById('notes').value || '';

    withBrandingTemp(() => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });

      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();

      // Render canvas image
      const img = canvas.toDataURL({ format:'png', multiplier: 2, enableRetinaScaling: true });

      // Fit image to page with margins
      const margin = 36;
      const maxW = pageW - margin*2;
      const maxH = pageH * 0.58; // leave room for notes below

      // Image aspect ratio
      const imgW = canvas.getWidth();
      const imgH = canvas.getHeight();
      const scale = Math.min(maxW / imgW, maxH / imgH);

      const drawW = imgW * scale;
      const drawH = imgH * scale;

      const x = (pageW - drawW) / 2;
      const y = margin;

      pdf.addImage(img, 'PNG', x, y, drawW, drawH);

      // Title / branding (BLACK)
      pdf.setTextColor(0,0,0);
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(14);
      pdf.text('TactiGrid Drill Designer', margin, y + drawH + 28);

      // Notes
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(11);
      const wrapped = pdf.splitTextToSize(notesText, pageW - margin*2);
      pdf.text(wrapped, margin, y + drawH + 52);

      // Footer branding in BLACK
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(10);
      pdf.text('TactiGrid', pageW - margin, pageH - 18, { align:'right' });

      pdf.save('tactigrid-drill.pdf');
    });
  });

  // ----------------------------
  // Keep everything consistent when switching modes
  // ----------------------------
  function applyModeToExistingObjects(){
    canvas.getObjects().forEach(o => {
      if (o.isPitch) return;
      o.selectable = (mode === 'edit');
      o.evented = (mode === 'edit');
    });
    canvas.requestRenderAll();
  }

  // When mode changes, update existing objects
  addModeBtn.addEventListener('click', applyModeToExistingObjects);
  editModeBtn.addEventListener('click', applyModeToExistingObjects);

  // ----------------------------
  // Init
  // ----------------------------
  function init(){
    fitCanvasToFrame();
    makePitch(pitchTypeSel.value);
    resetHistory();
    setMode('add');

    // On window resize
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        rebuildPitchPreserveObjects();
        refreshSelectability();
      }, 120);
    });
  }

  init();

})();
</script>
</body>
</html>
