<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TactiGrid Drill Designer</title>

  <!-- Konva (canvas framework) -->
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <!-- jsPDF (PDF export) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <style>
    :root{
      --bg:#0b0b0f;
      --panel:#12121a;
      --panel2:#171724;
      --text:#f2f2f2;
      --muted:#b8b8c7;
      --accent:#ffd400;
      --border: rgba(255,255,255,.10);
      --shadow: 0 10px 30px rgba(0,0,0,.45);
      --radius: 14px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 20% 0%, #141427, var(--bg));
      color: var(--text);
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px;
      padding-bottom: 32px;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 14px 14px 10px;
      background: linear-gradient(180deg, rgba(255,212,0,.10), rgba(255,212,0,0));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex; align-items:center; gap:12px;
      min-width: 0;
    }
    .logo{
      width:42px; height:42px;
      border-radius: 12px;
      background: rgba(255,212,0,.16);
      border: 1px solid rgba(255,212,0,.35);
      display:grid; place-items:center;
      flex: 0 0 auto;
    }
    .logo svg{ width:24px; height:24px; fill: var(--accent); }

    h1{
      margin:0;
      font-size: 18px;
      letter-spacing:.3px;
      line-height:1.1;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .sub{
      margin:2px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .topActions{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pill{
      display:flex; align-items:center; gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
    }

    .panel{
      margin-top: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .toolbar{
      padding: 10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0));
    }

    .toolGroup{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .label{
      font-size:12px;
      color: var(--muted);
      margin-right: 6px;
    }

    button, select, input[type="color"]{
      font: inherit;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor:pointer;
      user-select:none;
      transition: transform .05s ease, background .15s ease, border-color .15s ease;
      touch-action: manipulation;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
    .btn:active{ transform: translateY(1px); }
    .btn svg{ width:18px; height:18px; fill: currentColor; opacity:.95; }

    .btn.primary{
      background: rgba(255,212,0,.18);
      border-color: rgba(255,212,0,.35);
      color: #fff;
    }
    .btn.primary:hover{ background: rgba(255,212,0,.25); }

    .btn.on{
      outline: 2px solid rgba(255,212,0,.55);
      outline-offset: 0px;
      border-color: rgba(255,212,0,.50);
    }

    .btn.danger{
      background: rgba(255,40,40,.13);
      border-color: rgba(255,40,40,.25);
    }
    .btn.danger:hover{
      background: rgba(255,40,40,.18);
      border-color: rgba(255,40,40,.35);
    }

    .select, .color{
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      min-height: 42px;
    }
    select.select{
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--muted) 50%),
        linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
        calc(100% - 16px) calc(1em + 2px),
        calc(100% - 11px) calc(1em + 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 32px;
    }

    .stageWrap{
      padding: 12px;
      background: var(--panel2);
    }

    .stageCard{
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow:hidden;
      background: #0d0f18;
    }

    /* Responsive stage sizing */
    #stageHost{
      width: 100%;
      height: min(70vh, 720px);
    }

    /* Notes */
    .notes{
      padding: 12px;
      border-top: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    }
    .notes h2{
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing:.2px;
      color: var(--accent);
    }
    textarea{
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      outline: none;
      line-height: 1.35;
    }
    textarea::placeholder{ color: rgba(255,255,255,.40); }

    .hintRow{
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .kbd{
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-bottom-color: rgba(255,255,255,.18);
      border-radius: 8px;
      background: rgba(0,0,0,.25);
      color: rgba(255,255,255,.85);
    }

    /* Mobile tweaks */
    @media (max-width: 640px){
      .wrap{ padding: 10px; }
      header{ padding: 12px; }
      .btn{ padding: 10px 10px; }
      #stageHost{ height: 62vh; }
      .sub{ display:none; }
    }

    /* Editable textarea overlay for Konva text editing */
    .konva-textarea{
      position:absolute;
      z-index: 50;
      border: 1px solid rgba(255,212,0,.45);
      border-radius: 10px;
      padding: 8px 10px;
      outline: none;
      background: rgba(0,0,0,.86);
      color: #fff;
      font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      line-height: 1.2;
      box-shadow: 0 12px 32px rgba(0,0,0,.55);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <!-- small grid icon -->
          <svg viewBox="0 0 24 24">
            <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
          </svg>
        </div>
        <div style="min-width:0">
          <h1>TactiGrid Drill Designer</h1>
          <div class="sub">Design drills fast: place equipment, draw movements, export PNG/PDF.</div>
        </div>
      </div>

      <div class="topActions">
        <div class="pill">
          <span style="color:var(--accent);font-weight:700">Mode</span>
          <span id="modeLabel">Add</span>
        </div>
      </div>
    </header>

    <div class="panel">
      <div class="toolbar">
        <!-- Left: Pitch + Edit mode -->
        <div class="toolGroup">
          <span class="label">Pitch</span>
          <select id="pitchType" class="select" title="Pitch type">
            <option value="full">Full pitch</option>
            <option value="half">Half pitch</option>
            <option value="blank">Blank</option>
          </select>

          <button id="editBtn" class="btn primary" title="Select/Edit tool">
            <!-- pencil -->
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.83H5v-.92l8.06-8.06.92.92L5.92 20.08zM20.71 7.04a1.003 1.003 0 0 0 0-1.42L18.37 3.29a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.83z"/></svg>
            Edit
          </button>

          <button id="deleteBtn" class="btn danger" title="Delete selected">
            <!-- trash -->
            <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
            Delete
          </button>
        </div>

        <!-- Middle: Add equipment -->
        <div class="toolGroup">
          <span class="label">Add</span>

          <button class="btn" data-add="player" title="Add player">
            <!-- circle -->
            <svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z"/></svg>
            Player
          </button>

          <button class="btn" data-add="ball" title="Add ball">
            <!-- ball -->
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.4 6.2-2.9-.7-1.3-2.7 2.5-1.3c.7.6 1.3 1.3 1.7 2.1zM7.8 4.7 6.5 7.4 3.6 8.1c.4-.8 1-1.5 1.7-2.1l2.5 1.3zM3 12c0-.5 0-1 .1-1.4l3.1-.8 2 2-1.1 3-2.9 1c-.8-1.2-1.2-2.6-1.2-3.8zm9 7c-1.5 0-2.8-.4-3.9-1.2l1-2.9 3-1.1 3 1.1 1 2.9c-1.1.8-2.4 1.2-3.9 1.2zm7.1-3.2-2.9-1-1.1-3 2-2 3.1.8c.1.5.1.9.1 1.4 0 1.2-.4 2.6-1.2 3.8z"/></svg>
            Ball
          </button>

          <button class="btn" data-add="cone" title="Add cone">
            <!-- cone -->
            <svg viewBox="0 0 24 24"><path d="M12 3 4 21h16L12 3zm0 4.9L17.3 19H6.7L12 7.9z"/></svg>
            Cone
          </button>

          <button class="btn" data-add="goal" title="Add goal">
            <!-- classic goal -->
            <svg viewBox="0 0 24 24"><path d="M4 6h16v14h-2V8H6v12H4V6zm4 6h8v2H8v-2zm0 4h8v2H8v-2z"/></svg>
            Goal
          </button>

          <button class="btn" data-add="mannequin" title="Add mannequin">
            <!-- mannequin -->
            <svg viewBox="0 0 24 24"><path d="M12 3c2.2 0 4 1.8 4 4 0 1.2-.5 2.2-1.3 3h.3c1.7 0 3 1.3 3 3v8h-2v-8c0-.6-.4-1-1-1H9c-.6 0-1 .4-1 1v8H6v-8c0-1.7 1.3-3 3-3h.3C8.5 9.2 8 8.2 8 7c0-2.2 1.8-4 4-4zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Mannequin
          </button>

          <button class="btn" data-add="pole" title="Add pole">
            <!-- pole -->
            <svg viewBox="0 0 24 24"><path d="M11 2h2v20h-2V2zm-4 4h2v2H7V6zm8 0h2v2h-2V6z"/></svg>
            Pole
          </button>

          <button class="btn" data-add="flag" title="Add flag">
            <!-- improved flag -->
            <svg viewBox="0 0 24 24">
              <path d="M6 2h2v20H6V2z"/>
              <path d="M8 3c3 0 4 2 7 2 1.4 0 2.7-.4 3-.5v9c-.3.1-1.6.5-3 .5-3 0-4-2-7-2v-9z"/>
              <path d="M8 12c3 0 4 2 7 2 1.4 0 2.7-.4 3-.5" opacity=".35"/>
            </svg>
            Flag
          </button>

          <button class="btn" data-add="text" title="Add text">
            <!-- T -->
            <svg viewBox="0 0 24 24"><path d="M5 4h14v3h-5v13h-4V7H5V4z"/></svg>
            Text
          </button>
        </div>

        <!-- Right: Lines + color + export -->
        <div class="toolGroup">
          <span class="label">Lines</span>
          <select id="lineType" class="select" title="Line type">
            <option value="none">Off</option>
            <option value="straight">Straight</option>
            <option value="arrow">Arrow</option>
            <option value="dashed">Dashed</option>
            <option value="curved">Curved</option>
          </select>

          <input id="strokeColor" class="color" type="color" value="#ffd400" title="Line/object colour" />

          <button id="undoBtn" class="btn" title="Undo">
            <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7c3.3 0 6 2.7 6 6 0 1.1-.3 2.1-.8 3l1.8 1C19.6 15.9 20 14.5 20 13c0-4.4-3.6-8-8-8z"/></svg>
            Undo
          </button>

          <button id="clearBtn" class="btn danger" title="Clear all">
            <svg viewBox="0 0 24 24"><path d="M6 7h12v14H6V7zm3-4h6l1 2H8l1-2z"/></svg>
            Clear
          </button>

          <button id="pngBtn" class="btn primary" title="Export PNG">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 15l2.5-3.2 1.8 2.2L14 10l3 5H7z"/></svg>
            PNG
          </button>

          <button id="pdfBtn" class="btn primary" title="Export PDF (includes notes)">
            <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2zm8 1.5V8h4.5L14 3.5zM7 13h10v2H7v-2zm0 4h10v2H7v-2zm0-8h6v2H7V9z"/></svg>
            PDF
          </button>
        </div>
      </div>

      <div class="stageWrap">
        <div class="stageCard">
          <div id="stageHost"></div>
          <div class="notes">
            <h2>Session Notes</h2>
            <textarea id="notesArea" placeholder="Write your coaching points, constraints, targets, progressions, etc..."></textarea>
            <div class="hintRow">
              <span><span class="kbd">Edit</span> mode: drag, resize, rotate, select.</span>
              <span><span class="kbd">Double-click/tap</span> text to edit.</span>
              <span><span class="kbd">Lines</span>: choose type, then draw on the pitch.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);

  function downloadDataUrl(dataUrl, filename){
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function wrapTextToWidth(doc, text, maxWidth){
    // Simple word wrap for jsPDF
    const words = (text || '').split(/\s+/);
    const lines = [];
    let line = '';
    for (const w of words){
      const test = line ? (line + ' ' + w) : w;
      if (doc.getTextWidth(test) > maxWidth){
        if (line) lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // ---------- Konva setup ----------
  const host = $('stageHost');

  // Logical canvas size (we scale to fit host)
  const LOGICAL_W = 1200;
  const LOGICAL_H = 700;

  const stage = new Konva.Stage({
    container: host,
    width: host.clientWidth,
    height: host.clientHeight
  });

  // Layers
  const bgLayer = new Konva.Layer();
  const drawLayer = new Konva.Layer();
  stage.add(bgLayer);
  stage.add(drawLayer);

  // A background rect so export ALWAYS has a solid base
  const bgBase = new Konva.Rect({ x:0, y:0, width: LOGICAL_W, height: LOGICAL_H, fill: '#0f6d3f' });
  bgLayer.add(bgBase);

  // Pitch groups
  const pitchGroup = new Konva.Group({ x:0, y:0 });
  bgLayer.add(pitchGroup);

  // Selection Transformer (resize/rotate)
  const transformer = new Konva.Transformer({
    rotateEnabled: true,
    enabledAnchors: ['top-left','top-right','bottom-left','bottom-right','middle-left','middle-right','top-center','bottom-center'],
    anchorSize: 12,
    borderStroke: 'rgba(255,212,0,.85)',
    anchorStroke: 'rgba(255,212,0,.85)',
    anchorFill: 'rgba(0,0,0,.9)',
    anchorCornerRadius: 8,
    borderDash: [6, 4],
    keepRatio: false
  });
  drawLayer.add(transformer);

  // History for Undo
  let history = [];
  let historyIndex = -1;

  function saveHistory(){
    // We store JSON of drawLayer only (bg is deterministic by pitch type)
    const snap = {
      pitch: $('pitchType').value,
      draw: drawLayer.toJSON()
    };
    // truncate forward
    history = history.slice(0, historyIndex + 1);
    history.push(snap);
    historyIndex++;
  }

  function restoreHistory(idx){
    const snap = history[idx];
    if (!snap) return;
    $('pitchType').value = snap.pitch;
    drawPitch(snap.pitch);

    // Destroy all nodes except transformer, then recreate from JSON
    const keep = transformer;
    transformer.nodes([]);

    drawLayer.destroyChildren();
    drawLayer.add(keep);

    const newLayer = Konva.Node.create(snap.draw, stage);
    // newLayer is a Layer-like node. We want its children (excluding its own transformer if any).
    const kids = newLayer.getChildren();
    kids.forEach(n => {
      if (n.className !== 'Transformer') drawLayer.add(n);
    });
    newLayer.destroy();

    // Re-attach selection events
    attachNodeBehavioursToAll();

    drawLayer.batchDraw();
    bgLayer.batchDraw();
    updateModeUI();
  }

  function undo(){
    if (historyIndex <= 0) return;
    historyIndex--;
    restoreHistory(historyIndex);
  }

  // ---------- Mode & Tools ----------
  let mode = 'add'; // 'add' or 'edit'
  let addType = 'player';
  let lineType = 'none';
  let strokeColor = $('strokeColor').value;

  function setMode(newMode){
    mode = newMode;
    transformer.nodes([]);
    updateModeUI();
    // toggle draggability based on mode
    drawLayer.getChildren().forEach(node => {
      if (node === transformer) return;
      if (node.getAttr('isDrawable') === true) return; // lines are not draggable
      node.draggable(mode === 'edit');
    });
    drawLayer.batchDraw();
  }

  function updateModeUI(){
    $('modeLabel').textContent = (mode === 'edit') ? 'Edit' : 'Add';
    $('editBtn').classList.toggle('on', mode === 'edit');
  }

  $('editBtn').addEventListener('click', () => {
    setMode(mode === 'edit' ? 'add' : 'edit');
  });

  $('strokeColor').addEventListener('input', (e) => {
    strokeColor = e.target.value;
  });

  $('lineType').addEventListener('change', (e) => {
    lineType = e.target.value;
    // drawing lines implies add mode (so you don't accidentally select)
    if (lineType !== 'none') setMode('add');
  });

  // Add buttons
  document.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      addType = btn.getAttribute('data-add');
      // if they choose to add equipment, switch to add mode
      setMode('add');
      // turn off line drawing unless user wants it
      $('lineType').value = 'none';
      lineType = 'none';
      // UI highlight
      document.querySelectorAll('[data-add]').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    });
  });

  // default highlight
  document.querySelector('[data-add="player"]').classList.add('on');

  // ---------- Pitch drawing ----------
  function clearPitch(){
    pitchGroup.destroyChildren();
  }

  function drawFullPitchLines(){
    // white pitch lines
    const W = LOGICAL_W, H = LOGICAL_H;
    const pad = 40;
    const line = (shape) => { shape.stroke('white'); shape.strokeWidth(3); shape.opacity(0.95); return shape; };

    // Outer boundary
    pitchGroup.add(line(new Konva.Rect({ x:pad, y:pad, width: W-2*pad, height: H-2*pad, fillEnabled:false })));

    // Halfway line
    pitchGroup.add(line(new Konva.Line({ points:[W/2, pad, W/2, H-pad] })));

    // Center circle + spot
    pitchGroup.add(line(new Konva.Circle({ x:W/2, y:H/2, radius: 90 })));
    pitchGroup.add(new Konva.Circle({ x:W/2, y:H/2, radius: 4, fill:'white', opacity:0.95 }));

    // Penalty areas + 6-yard boxes
    const boxW = 200, boxH = 420;
    const sixW = 80, sixH = 220;

    // Left penalty
    pitchGroup.add(line(new Konva.Rect({ x:pad, y:(H-boxH)/2, width: boxW, height: boxH, fillEnabled:false })));
    pitchGroup.add(line(new Konva.Rect({ x:pad, y:(H-sixH)/2, width: sixW, height: sixH, fillEnabled:false })));
    pitchGroup.add(new Konva.Circle({ x: pad + 120, y: H/2, radius: 4, fill:'white', opacity:0.95 }));

    // Right penalty
    pitchGroup.add(line(new Konva.Rect({ x:W-pad-boxW, y:(H-boxH)/2, width: boxW, height: boxH, fillEnabled:false })));
    pitchGroup.add(line(new Konva.Rect({ x:W-pad-sixW, y:(H-sixH)/2, width: sixW, height: sixH, fillEnabled:false })));
    pitchGroup.add(new Konva.Circle({ x: W - pad - 120, y: H/2, radius: 4, fill:'white', opacity:0.95 }));

    // Arcs (approx)
    pitchGroup.add(line(new Konva.Arc({ x: pad + boxW, y:H/2, innerRadius: 89, outerRadius: 90, angle: 120, rotation: 300 })));
    pitchGroup.add(line(new Konva.Arc({ x: W - pad - boxW, y:H/2, innerRadius: 89, outerRadius: 90, angle: 120, rotation: 120 })));
  }

  function drawHalfPitchLines(){
    const W = LOGICAL_W, H = LOGICAL_H;
    const pad = 40;
    const line = (shape) => { shape.stroke('white'); shape.strokeWidth(3); shape.opacity(0.95); return shape; };

    // We'll draw the right half of a full pitch (attacking half)
    // Outer
    pitchGroup.add(line(new Konva.Rect({ x:pad, y:pad, width: W-2*pad, height: H-2*pad, fillEnabled:false })));

    // Midline at left edge-ish (represent halfway line)
    pitchGroup.add(line(new Konva.Line({ points:[pad + 80, pad, pad + 80, H-pad] })));

    // Center circle partly (at halfway line)
    pitchGroup.add(line(new Konva.Arc({ x: pad + 80, y:H/2, innerRadius: 89, outerRadius: 90, angle: 180, rotation: 270 })));
    pitchGroup.add(new Konva.Circle({ x: pad + 80, y:H/2, radius: 4, fill:'white', opacity:0.95 }));

    // Penalty on right
    const boxW = 200, boxH = 420;
    const sixW = 80, sixH = 220;
    pitchGroup.add(line(new Konva.Rect({ x:W-pad-boxW, y:(H-boxH)/2, width: boxW, height: boxH, fillEnabled:false })));
    pitchGroup.add(line(new Konva.Rect({ x:W-pad-sixW, y:(H-sixH)/2, width: sixW, height: sixH, fillEnabled:false })));
    pitchGroup.add(new Konva.Circle({ x: W - pad - 120, y: H/2, radius: 4, fill:'white', opacity:0.95 }));
    pitchGroup.add(line(new Konva.Arc({ x: W - pad - boxW, y:H/2, innerRadius: 89, outerRadius: 90, angle: 120, rotation: 120 })));
  }

  function drawBlank(){
    // just a dark neutral base
    bgBase.fill('#10121a');
  }

  function drawPitch(type){
    clearPitch();
    if (type === 'blank'){
      drawBlank();
      bgLayer.batchDraw();
      return;
    }
    bgBase.fill('#0f6d3f'); // green base
    if (type === 'full') drawFullPitchLines();
    if (type === 'half') drawHalfPitchLines();
    bgLayer.batchDraw();
  }

  $('pitchType').addEventListener('change', (e) => {
    drawPitch(e.target.value);
    saveHistory();
  });

  // ---------- Node factory (equipment/text) ----------
  function makePlayer(x,y){
    const g = new Konva.Group({ x, y, draggable: mode==='edit', name: 'selectable' });

    const circle = new Konva.Circle({
      x:0, y:0, radius: 22,
      fill: strokeColor,
      stroke: 'rgba(255,255,255,.75)',
      strokeWidth: 2
    });

    const label = new Konva.Text({
      x:-22, y:-10, width:44,
      text: '1',
      fontSize: 16,
      fontStyle: '700',
      fontFamily: 'system-ui,Segoe UI,Arial',
      fill: '#0b0b0f',
      align: 'center'
    });

    g.add(circle);
    g.add(label);

    g.setAttr('kind','player');
    g.setAttr('labelNodeId', label._id);

    return g;
  }

  function makeBall(x,y){
    const g = new Konva.Group({ x, y, draggable: mode==='edit', name: 'selectable' });
    const outer = new Konva.Circle({ x:0,y:0,radius:16, fill:'#ffffff', stroke:'rgba(0,0,0,.5)', strokeWidth:2 });
    const inner = new Konva.Circle({ x:0,y:0,radius:6, fill: strokeColor, opacity:0.9 });
    g.add(outer); g.add(inner);
    g.setAttr('kind','ball');
    return g;
  }

  function makeCone(x,y){
    const g = new Konva.Group({ x, y, draggable: mode==='edit', name: 'selectable' });
    const tri = new Konva.RegularPolygon({ x:0,y:6, sides:3, radius:22, fill: strokeColor, stroke:'rgba(255,255,255,.6)', strokeWidth:2 });
    const base = new Konva.Rect({ x:-18, y:22, width:36, height:8, fill:'rgba(255,255,255,.25)' });
    g.add(tri); g.add(base);
    g.setAttr('kind','cone');
    return g;
  }

  function makeGoal(x,y){
    // "Old-style" simple goal frame + faint net lines
    const g = new Konva.Group({ x, y, draggable: mode==='edit', name: 'selectable' });
    const frame = new Konva.Rect({ x:-34,y:-22,width:68,height:44, stroke: strokeColor, strokeWidth:4, cornerRadius:4 });
    const net1 = new Konva.Line({ points:[-30,-16, 30,16], stroke:'rgba(255,255,255,.25)', strokeWidth:2 });
    const net2 = new Konva.Line({ points:[-30,16, 30,-16], stroke:'rgba(255,255,255,.25)', strokeWidth:2 });
    g.add(frame); g.add(net1); g.add(net2);
    g.setAttr('kind','goal');
    return g;
  }

  function makeMannequin(x,y){
    const g = new Konva.Group({ x, y, draggable: mode==='edit', name: 'selectable' });
    const body = new Konva.Rect({ x:-14,y:-22,width:28,height:56, cornerRadius: 14, fill:'rgba(255,255,255,.10)', stroke: strokeColor, strokeWidth:3 });
    const head = new Konva.Circle({ x:0,y:-34,radius:10, fill:'rgba(255,255,255,.10)', stroke: strokeColor, strokeWidth:3 });
    g.add(head); g.add(body);
    g.setAttr('kind','mannequin');
    return g;
  }

  function makePole(x,y){
    const g = new Konva.Group({ x, y, draggable: mode==='edit', name: 'selectable' });
    const line = new Konva.Rect({ x:-3,y:-40,width:6,height:80, fill: strokeColor, cornerRadius: 3 });
    const cap = new Konva.Circle({ x:0,y:-42,radius:6, fill: 'rgba(255,255,255,.25)' });
    g.add(line); g.add(cap);
    g.setAttr('kind','pole');
    return g;
  }

  function makeFlag(x,y){
    const g = new Konva.Group({ x, y, draggable: mode==='edit', name: 'selectable' });
    const pole = new Konva.Rect({ x:-3,y:-44,width:6,height:88, fill:'rgba(255,255,255,.55)', cornerRadius:3 });
    const flag = new Konva.Line({
      points:[3,-40, 44,-30, 3,-20],
      closed:true,
      fill: strokeColor,
      stroke: 'rgba(255,255,255,.60)',
      strokeWidth:2,
      lineJoin:'round'
    });
    const stitch = new Konva.Line({
      points:[8,-36, 32,-30, 8,-24],
      stroke:'rgba(0,0,0,.25)',
      strokeWidth:2,
      lineCap:'round',
      lineJoin:'round',
      opacity:0.8
    });
    g.add(pole); g.add(flag); g.add(stitch);
    g.setAttr('kind','flag');
    return g;
  }

  function makeText(x,y){
    const t = new Konva.Text({
      x, y,
      text: 'Double-tap to edit',
      fontSize: 22,
      fontStyle: '700',
      fontFamily: 'system-ui,Segoe UI,Arial',
      fill: strokeColor,
      draggable: mode==='edit',
      name:'selectable'
    });
    t.setAttr('kind','text');
    return t;
  }

  function attachNodeBehaviours(node){
    // selection
    node.on('click tap', (e) => {
      if (mode !== 'edit') return;
      e.cancelBubble = true;
      transformer.nodes([node]);
      drawLayer.batchDraw();
    });

    // if group: allow selecting children too
    node.on('mousedown touchstart', (e) => {
      if (mode !== 'edit') return;
      e.cancelBubble = true;
    });

    // prevent transformer lingering when dragging ends
    node.on('dragend transformend', () => {
      saveHistory();
    });

    // easy text edit
    if (node.getAttr('kind') === 'text'){
      node.on('dblclick dbltap', () => editKonvaText(node));
    }

    // player label edit (double click / tap on group)
    if (node.getAttr('kind') === 'player'){
      node.on('dblclick dbltap', () => {
        const labelId = node.getAttr('labelNodeId');
        const label = drawLayer.findOne(node => node._id === labelId);
        if (label) editKonvaText(label, { asLabel:true, maxLen:3 });
      });
    }
  }

  function attachNodeBehavioursToAll(){
    drawLayer.getChildren().forEach(n => {
      if (n === transformer) return;
      attachNodeBehaviours(n);
    });
  }

  // Konva text editing overlay
  function editKonvaText(textNode, opts = {}){
    const stageBox = stage.container().getBoundingClientRect();
    const absPos = textNode.getAbsolutePosition();

    // transform to client coords
    const scale = stage.scaleX();
    const x = stageBox.left + absPos.x * scale;
    const y = stageBox.top + absPos.y * scale;

    const textarea = document.createElement('textarea');
    textarea.className = 'konva-textarea';
    textarea.value = textNode.text();
    textarea.style.left = `${x}px`;
    textarea.style.top = `${y}px`;

    // sizing
    const w = Math.max(140, (textNode.width() || 160) * scale);
    textarea.style.width = `${w}px`;
    textarea.style.height = `${Math.max(44, (textNode.height() + 10) * scale)}px`;

    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    const remove = (commit) => {
      if (commit){
        let v = textarea.value;
        if (opts.maxLen) v = v.slice(0, opts.maxLen);
        textNode.text(v);
        if (opts.asLabel){
          // center label inside player circle
          textNode.offsetX(textNode.width()/2);
        }
        saveHistory();
        drawLayer.batchDraw();
      }
      textarea.remove();
      window.removeEventListener('click', handleOutsideClick);
    };

    function handleOutsideClick(e){
      if (e.target !== textarea) remove(true);
    }

    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        remove(true);
      }
      if (e.key === 'Escape'){
        e.preventDefault();
        remove(false);
      }
    });

    // click outside commit
    setTimeout(() => window.addEventListener('click', handleOutsideClick), 0);
  }

  // ---------- Line drawing ----------
  let isDrawing = false;
  let currentLine = null;

  function makeLine(start, end){
    const common = {
      stroke: strokeColor,
      strokeWidth: 4,
      lineCap: 'round',
      lineJoin: 'round',
      name: 'selectable',
    };

    if (lineType === 'arrow'){
      const a = new Konva.Arrow({
        points: [start.x, start.y, end.x, end.y],
        pointerLength: 12,
        pointerWidth: 12,
        ...common
      });
      a.setAttr('isDrawable', true);
      a.setAttr('kind', 'line');
      return a;
    }

    const dashed = (lineType === 'dashed');
    const curved = (lineType === 'curved');

    const l = new Konva.Line({
      points: [start.x, start.y, end.x, end.y],
      tension: curved ? 0.5 : 0,
      bezier: curved,
      dash: dashed ? [12, 10] : [],
      ...common
    });
    l.setAttr('isDrawable', true);
    l.setAttr('kind','line');
    return l;
  }

  stage.on('mousedown touchstart', (e) => {
    // deselect if click empty in edit mode
    if (mode === 'edit'){
      const clickedOnEmpty = e.target === stage;
      if (clickedOnEmpty){
        transformer.nodes([]);
        drawLayer.batchDraw();
      }
      return;
    }

    // Add equipment
    if (lineType === 'none'){
      const pos = stage.getPointerPosition();
      if (!pos) return;
      const p = toLogical(pos);

      const node = (() => {
        switch(addType){
          case 'player': return makePlayer(p.x, p.y);
          case 'ball': return makeBall(p.x, p.y);
          case 'cone': return makeCone(p.x, p.y);
          case 'goal': return makeGoal(p.x, p.y);
          case 'mannequin': return makeMannequin(p.x, p.y);
          case 'pole': return makePole(p.x, p.y);
          case 'flag': return makeFlag(p.x, p.y);
          case 'text': return makeText(p.x, p.y);
          default: return makePlayer(p.x, p.y);
        }
      })();

      drawLayer.add(node);
      attachNodeBehaviours(node);
      drawLayer.batchDraw();
      saveHistory();
      return;
    }

    // Draw lines
    isDrawing = true;
    const pos = stage.getPointerPosition();
    if (!pos) return;
    const start = toLogical(pos);
    currentLine = makeLine(start, start);
    drawLayer.add(currentLine);
    drawLayer.batchDraw();
  });

  stage.on('mousemove touchmove', () => {
    if (!isDrawing || !currentLine) return;
    const pos = stage.getPointerPosition();
    if (!pos) return;
    const end = toLogical(pos);

    const pts = currentLine.points();
    pts[2] = end.x;
    pts[3] = end.y;
    currentLine.points(pts);
    drawLayer.batchDraw();
  });

  stage.on('mouseup touchend', () => {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentLine){
      saveHistory();
      currentLine = null;
    }
  });

  // ---------- Delete, Clear ----------
  $('deleteBtn').addEventListener('click', () => {
    const nodes = transformer.nodes();
    if (!nodes.length) return;
    nodes.forEach(n => n.destroy());
    transformer.nodes([]);
    drawLayer.batchDraw();
    saveHistory();
  });

  $('clearBtn').addEventListener('click', () => {
    transformer.nodes([]);
    drawLayer.getChildren().forEach(n => {
      if (n !== transformer) n.destroy();
    });
    drawLayer.batchDraw();
    saveHistory();
  });

  $('undoBtn').addEventListener('click', undo);

  // ---------- Export (PNG/PDF) ----------
  function exportStagePNG(pixelRatio=2){
    // Temporarily deselect transformer so it doesn't appear
    const prev = transformer.nodes();
    transformer.nodes([]);
    drawLayer.batchDraw();

    const dataUrl = stage.toDataURL({ pixelRatio });

    transformer.nodes(prev);
    drawLayer.batchDraw();
    return dataUrl;
  }

  $('pngBtn').addEventListener('click', () => {
    const url = exportStagePNG(3);
    downloadDataUrl(url, 'tactigrid-drill.png');
  });

  $('pdfBtn').addEventListener('click', async () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });

    const imgUrl = exportStagePNG(3);

    // Page sizing
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();

    // Reserve space for notes at bottom
    const margin = 28;
    const notesBoxH = 120;

    const availableW = pageW - margin*2;
    const availableH = pageH - margin*2 - notesBoxH;

    // Fit image into available box
    const img = new Image();
    img.src = imgUrl;
    await img.decode();

    const imgRatio = img.width / img.height;
    let drawW = availableW;
    let drawH = drawW / imgRatio;
    if (drawH > availableH){
      drawH = availableH;
      drawW = drawH * imgRatio;
    }
    const imgX = margin + (availableW - drawW)/2;
    const imgY = margin;

    doc.addImage(imgUrl, 'PNG', imgX, imgY, drawW, drawH, undefined, 'FAST');

    // Notes
    const notes = $('notesArea').value || '';
    doc.setFont('helvetica','bold');
    doc.setFontSize(12);
    doc.setTextColor(255, 212, 0);
    doc.text('Session Notes', margin, margin + availableH + 22);

    doc.setFont('helvetica','normal');
    doc.setFontSize(11);
    doc.setTextColor(20, 20, 20);

    // Notes box background (light)
    doc.setFillColor(245,245,245);
    doc.roundedRect(margin, margin + availableH + 30, availableW, notesBoxH - 30, 10, 10, 'F');

    doc.setTextColor(30,30,30);
    const lines = wrapTextToWidth(doc, notes, availableW - 20);
    const startY = margin + availableH + 52;
    let y = startY;
    for (const line of lines){
      if (y > margin + availableH + notesBoxH - 12) break;
      doc.text(line, margin + 10, y);
      y += 14;
    }

    doc.save('tactigrid-drill.pdf');
  });

  // ---------- Responsive scaling ----------
  function fitStage(){
    const w = host.clientWidth;
    const h = host.clientHeight;

    // scale based on width, keep logical aspect
    const scale = Math.min(w / LOGICAL_W, h / LOGICAL_H);

    stage.width(w);
    stage.height(h);
    stage.scale({ x: scale, y: scale });

    // Center logical canvas within host
    stage.position({
      x: (w - LOGICAL_W * scale) / 2,
      y: (h - LOGICAL_H * scale) / 2
    });
    stage.batchDraw();
  }

  function toLogical(pointerPos){
    // Convert from stage coordinates to logical coordinates (account for scale + offset)
    const scale = stage.scaleX();
    const lx = (pointerPos.x - stage.x()) / scale;
    const ly = (pointerPos.y - stage.y()) / scale;
    return { x: lx, y: ly };
  }

  window.addEventListener('resize', () => {
    fitStage();
  });

  // ---------- Click empty to deselect (edit mode) ----------
  stage.on('click tap', (e) => {
    if (mode !== 'edit') return;
    if (e.target === stage){
      transformer.nodes([]);
      drawLayer.batchDraw();
    }
  });

  // ---------- Init ----------
  drawPitch('full');
  setMode('add');
  fitStage();
  saveHistory(); // initial

})();
</script>
